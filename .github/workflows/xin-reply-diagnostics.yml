name: Xiaoxin reply diagnostics
on:
  push:
    branches: [codex/xin-reply-diagnostics-20261119]
    paths: [.github/workflows/xin-reply-diagnostics.yml]
permissions: {}
jobs:
  diagnose:
    if: github.repository == 'yux91803-hobo/liming-work-site' && github.ref_name == 'codex/xin-reply-diagnostics-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read sanitized foreground diagnostics for li
        env:
          LI_API_KEY: ${{ secrets.XIN_INSTABOX_API_KEY }}
        run: |
          python3 - <<'PY_REMOTE'
          import hashlib
          import json
          import os
          import re
          from collections import Counter
          from datetime import datetime, timezone
          from urllib.error import HTTPError
          from urllib.parse import quote, urlencode
          from urllib.request import HTTPRedirectHandler, Request, build_opener


          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None


          api = 'https://api.instabox.sh'
          opener = build_opener(NoRedirect())
          key = os.environ['LI_API_KEY']
          base = '/data/home/.xin/'


          def read(endpoint, limit):
              req = Request(api + endpoint, headers={'X-API-Key': key})
              with opener.open(req, timeout=25) as response:
                  raw = response.read(limit + 1)
              if len(raw) > limit:
                  raise ValueError('size limit')
              return raw


          def timestamp(value):
              if type(value) in (int, float) and 0 < value < 2e12:
                  return datetime.fromtimestamp(value / 1000, timezone.utc).strftime('%H:%M:%SZ')


          def error_kind(error):
              value = str(error or '')
              checks = [
                  ('dispatch_exhausted', '暂时没能安排好'), ('step_limit', '步数用完'),
                  ('unsupported_command', '允许的|只能|动作无效|参数|不支持|合法|未知'),
                  ('no_text', '没有返回文字|没有文字'), ('unfinished', '未完成回复'),
                  ('invalid_model', 'bad_front_model|unknown model|model not found'),
                  ('provider_credit', 'quota|credit|额度|resource.exhausted|rate.limit'),
                  ('credentials', 'unauthenticated|unauthorized|token expired|login|登录|auth required'),
                  ('deadline', 'time.?out|超时|deadline'), ('network', 'econn|fetch failed|network|socket'),
                  ('database', 'sqlite|database|owner_changed|state_recov'), ('protocol', '协议|ACP|Antigravity'),
                  ('stopped', 'stopped|已停止|cancel'),
              ]
              http = re.search(r'HTTP ([1-5][0-9]{2})\b', value)
              if http:
                  return 'http_' + http.group(1)
              return next((kind for kind, pattern in checks if re.search(pattern, value, re.I)), 'other' if value else None)


          def call_shape(row):
              parts = str(row.get('call', '')).split()
              command = ' '.join(parts[:3]) if parts[:2] == ['xin', 'task'] else ' '.join(parts[:2])
              known = {'xin task new', 'xin task show', 'xin task list', 'xin task tell', 'xin task stop',
                       'xin bond', 'xin move', 'xin next', 'xin remember', 'xin recall', 'xin forget',
                       'finish_event deliver', 'finish_event silent'}
              return {'call': command if command in known else 'other',
                      'options': [p for p in parts if p in {'--model', '--kind', '--dir', '--goal', '--title', '--no', '--review', '--parent'}],
                      'error': error_kind(row.get('error')), 'terminal': row.get('terminal') is True}


          def rows(raw):
              for line in raw.splitlines():
                  try:
                      entry = json.loads(line)
                      if isinstance(entry, dict):
                          yield entry
                  except (ValueError, UnicodeError):
                      continue


          def main():
              machines = json.loads(read('/v1/machines', 1024*1024))['machines']
              matches = [row for row in machines if row.get('name') == 'li']
              if len(matches) != 1:
                  raise ValueError('li selection')
              m = matches[0]
              print('LI_STATUS', m.get('state', m.get('status')), flush=True)
              endpoint = '/v1/machines/' + quote(m['id'], safe='') + '/files/content?'

              def load(relative, limit=512*1024):
                  try:
                      return read(endpoint + urlencode({'path': base+relative}), limit)
                  except HTTPError as e:
                      print('READ_FAILED', relative.split('/')[0], e.code, flush=True)
                      return b''

              front = list(rows(load('logs/front.jsonl')))
              known_protocol = {'format_repair', 'format_fallback', 'front_model_missing', 'front_model_fallback',
                                'empty', 'object', 'structured', 'prose', 'invalid', 'text', 'updates', 'tool', 'json'}
              for row in front[-9:]:
                  protocol = row.get('protocol') or {}
                  print('FRONT', json.dumps({'at': timestamp(row.get('at')), 'outcome': row.get('outcome'),
                                            'error': error_kind(row.get('error')), 'error_bytes': len(str(row.get('error') or '')),
                                            'calls': [call_shape(c) for c in row.get('calls', [])],
                                            'protocol': {k: protocol[k].get('count') for k in known_protocol & protocol.keys()},
                                            'protocol_unknown': len(protocol.keys() - known_protocol)}), flush=True)

              q = json.loads(load('front-antigravity-quota.json', 16*1024) or b'{}')
              print('FRONT_QUOTA', json.dumps({**{k: q.get(k) is True for k in ('blocked', 'providerExhausted')},
                                              'retryAt': timestamp(q.get('retryAt')), 'updatedAt': timestamp(q.get('at'))}), flush=True)
              kernel = list(rows(load('logs/kernel.jsonl', 2200*1024)))
              recent = [row for row in kernel if (row.get('at') or 0) >= 1795058580000]
              recognized = {'send', 'front_immediate', 'front_model', 'front_quota', 'front_action', 'front_fallback', 'run_complete'}
              counts = Counter(f"{row.get('op')}:{row.get('status')}" for row in recent if row.get('op') in recognized)
              version = {row['agent'] for row in kernel[-160:] if re.fullmatch(r'[0-9a-f]{12}', str(row.get('agent', '')))}
              print('KERNEL_RECENT', json.dumps({'outcomes': counts, 'builds_seen': sorted(version)}), flush=True)


          try:
              main()
          except HTTPError as e:
              raise SystemExit('InstaBox API status ' + str(e.code)) from None
          except (ValueError, KeyError, TypeError, OSError) as e:
              raise SystemExit('Diagnostic failed ' + type(e).__name__) from None
          PY_REMOTE
