name: Xiaoxin reply diagnostics
on:
  push:
    branches: [codex/xin-reply-diagnostics-20261119]
    paths: [.github/workflows/xin-reply-diagnostics.yml]
permissions: {}
jobs:
  diagnose:
    if: github.repository == 'yux91803-hobo/liming-work-site' && github.ref_name == 'codex/xin-reply-diagnostics-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Compare isolated provider replies without changing li services
        env:
          LI_API_KEY: ${{ secrets.XIN_INSTABOX_API_KEY }}
        run: |
          python3 - <<'PY_REMOTE'
          import json
          import os
          from urllib.parse import quote
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None

          opener = build_opener(NoRedirect())
          api = 'https://api.instabox.sh/v1/machines'
          headers = {'X-API-Key': os.environ['LI_API_KEY'], 'Content-Type': 'application/json'}
          with opener.open(Request(api,headers=headers),timeout=30) as r:
              rows = [m for m in json.load(r)['machines'] if m.get('name')=='li']
          if len(rows)!=1 or rows[0].get('state')!='running':
              raise SystemExit('Expected a single running li machine')
          remote = "import http.client\nimport json\nimport os\nimport re\nimport selectors\nimport signal\nimport subprocess\nimport tempfile\nimport time\nfrom collections import Counter\nfrom pathlib import Path\n\n\nROOT = Path('/data/home/.xin')\ncfg = json.loads((ROOT/'kernel.env.json').read_text())\nif cfg.get('XIN_ROLE') == 'tianqi':\n    raise SystemExit('Unexpected Tianqi provider profile')\nhome = Path(cfg.get('XIN_AGY_HOME') or '/data/home')\nbinary = next((p for p in (cfg.get('XIN_ANTIGRAVITY_BIN'), home/'.local/bin/agy', home/'.gemini/bin/agy') if p and Path(p).is_file()), None)\nenv = {'HOME':str(home),'PATH':cfg.get('PATH') or '/usr/local/bin:/usr/bin:/bin','LANG':'C.UTF-8'}\nMARKER = '松果好'\n\n\ndef classify(text):\n    return [k for k,p in {\n        'capacity':r'capacity|temporarily unavailable|service unavailable|overloaded|busy|503',\n        'retry':r'retrying|retry in|retrying in|retrying request',\n        'quota':r'quota|exhausted|rate limit|throttl|429|额度',\n        'auth':r'auth|not signed in|token expired|401|403',\n        'transport':r'timeout|connection|network|deadline|transport',\n        'server':r'error|failed|internal|unexpected|502|504',\n        'cancelled':r'cancelled|canceled|aborted',\n        'model':r'not supported|model unavailable|model not found|invalid model',\n    }.items() if re.search(p,text,re.I)]\n\n\ndef agy(work, level):\n    counts, chunks = Counter(), []\n    begin = time.monotonic()\n    reply = {'level':level,'done':False,'marker':False,'phase':'startup'}\n    with subprocess.Popen([binary,'acp','--agent','xin-front-controller','--log-file','/dev/null'],\n                          stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,\n                          cwd=work,env=env,start_new_session=True) as child:\n        try:\n            with selectors.DefaultSelector() as select:\n                select.register(child.stdout,selectors.EVENT_READ)\n                buffer = b''\n\n                def send(data):\n                    child.stdin.write(json.dumps({'jsonrpc':'2.0', **data}).encode()+b'\\n')\n                    child.stdin.flush()\n\n                def request(id, method, params):\n                    reply['phase'] = method\n                    send({'id':id, 'method':method, 'params':params})\n\n                request(1,'initialize',{'protocolVersion':1,'clientInfo':{'name':'xin-front','version':'1'},\n                                         'clientCapabilities':{'fs':{'readTextFile':False,'writeTextFile':False},'terminal':False}})\n                sid = None\n                while time.monotonic() - begin < 56 and not reply['done']:\n                    if not select.select(0.5):\n                        continue\n                    data = os.read(child.stdout.fileno(),32768)\n                    if not data:\n                        reply['process_closed'] = True\n                        break\n                    buffer += data\n                    while b'\\n' in buffer:\n                        line, buffer = buffer.split(b'\\n',1)\n                        try: message = json.loads(line)\n                        except ValueError: continue\n                        if method := message.get('method'):\n                            if 'id' in message:\n                                send({'id':message['id'],'result':{'outcome':{'outcome':'cancelled'}}} if method=='session/request_permission'\n                                     else {'id':message['id'],'error':{'code':-32601,'message':'Unavailable'}})\n                            update = (message.get('params') or {}).get('update') or {}\n                            if update.get('sessionUpdate') == 'agent_message_chunk':\n                                chunks.append(str((update.get('content') or {}).get('text',''))[:2048])\n                            if update.get('sessionUpdate') in {'agent_message_chunk','agent_thought_chunk','usage_update','tool_call','tool_call_update'}:\n                                counts[update['sessionUpdate']] += 1\n                            continue\n                        if 'error' in message:\n                            error = message['error']\n                            reply.update(error_code=error.get('code') if type(error.get('code')) is int else None,\n                                         errors=classify(str(error.get('message') or '')))\n                            return reply\n                        data = message.get('result') or {}\n                        if message.get('id') == 1:\n                            request(2,'session/new',{'cwd':work,'mcpServers':[]})\n                        elif message.get('id') == 2:\n                            sid = data.get('sessionId')\n                            models = data.get('models',{}).get('availableModels',[])\n                            model = next((m['modelId'] for m in models if m.get('modelId')=='gemini-4-hydrogen-'+level or re.search('Gemini\\\\W+4\\\\W+Hydrogen\\\\W+'+level,m.get('name',''),re.I)),None)\n                            if not (sid and model):\n                                reply['model_missing'] = True\n                                return reply\n                            request(3,'session/set_model',{'sessionId':sid,'modelId':model})\n                        elif message.get('id') == 3:\n                            content=json.dumps({'instructions':'用控制器期望的 JSON 格式回复。不要调用工具。', 'input':[{'role':'user','content':'只回复 '+MARKER}], 'tools':[], 'replyFormat':{'text':'自然回复','calls':[]}},ensure_ascii=False)\n                            request(4,'session/prompt',{'sessionId':sid,'prompt':[{'type':'text','text':content}]})\n                        elif message.get('id') == 4:\n                            reply.update(done=data.get('stopReason')=='end_turn',prompt_resolved=True)\n                            return reply\n        finally:\n            if child.poll() is None:\n                os.killpg(child.pid,signal.SIGKILL)\n            child.wait(timeout=4)\n            reply.update(marker=MARKER in ''.join(chunks),counts=counts,distinct_chunks=len(set(chunks)),\n                         chunk_bytes=sorted(set(len(c.encode()) for c in chunks)),\n                         chunk_categories=classify(''.join(chunks)),seconds=round(time.monotonic()-begin,1))\n    return reply\n\n\ndef gateway():\n    key = next((p.read_text().strip() for p in (ROOT/'codex.key',ROOT/'harness.key') if p.is_file() and p.stat().st_size), '')\n    con = http.client.HTTPConnection('127.0.0.1',8788,timeout=35)\n    try:\n        payload={'model':'deepseek-v4.1-flash','input':'只回复 '+MARKER,'stream':False,\n                 'reasoning':{'effort':'max'},'max_output_tokens':3000}\n        con.request('POST','/v1/responses',body=json.dumps(payload).encode(),headers={'Content-Type':'application/json','Authorization':'Bearer '+key})\n        response=con.getresponse(); text=response.read(1024*1024).decode('utf-8','replace')\n        data=json.loads(text)\n        output=''.join(c.get('text','') for i in data.get('output',[]) if i.get('type')=='message' for c in i.get('content',[]) if c.get('type')=='output_text')\n        return {'http':response.status,'marker':MARKER in output, 'errors':classify(str(data.get('error') or ''))}\n    except (OSError,ValueError,http.client.HTTPException):\n        return {'transport':False}\n    finally:\n        con.close()\n\n\ndef main():\n    from concurrent.futures import ThreadPoolExecutor\n    if not binary or not (home/'.gemini/config/agents/xin-front-controller.md').is_file():\n        raise SystemExit('Configured production ACP opener missing')\n    version=subprocess.run([binary,'--version'],env=env,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=12).stdout\n    version=re.search(r'(?<!\\d)\\d+\\.\\d+\\.\\d+(?!\\d)',version)\n    print('AGY_VERSION',version.group(0) if version else 'unknown',flush=True)\n    with tempfile.TemporaryDirectory(prefix='xin-reply-probe-',dir='/data/tmp') as work, ThreadPoolExecutor(max_workers=2) as pool:\n        fallback=pool.submit(gateway)\n        high=agy(work,'high')\n        print('AGY_SYNTHETIC',json.dumps(high),flush=True)\n        print('GATEWAY_SYNTHETIC',json.dumps(fallback.result()),flush=True)\n        if not (high['done'] and high['marker']):\n            print('AGY_SYNTHETIC',json.dumps(agy(work,'medium')),flush=True)\n\n\ntry:\n    main()\nexcept (OSError,ValueError,subprocess.SubprocessError,KeyError) as error:\n    raise SystemExit('Provider check failed '+type(error).__name__) from None\n"
          body = json.dumps({'argv':['python3','-c',remote],'timeoutSeconds':158}).encode()
          with opener.open(Request(api+'/'+quote(rows[0]['id'],safe='')+'/exec',headers=headers,data=body),timeout=178) as r:
              result = json.load(r)
          for line in result.get('stdout','').splitlines():
              if line.startswith(('AGY_VERSION ', 'AGY_SYNTHETIC ', 'GATEWAY_SYNTHETIC ')): print(line,flush=True)
          if result.get('exitCode')!=0:
              raise SystemExit('Isolated provider probe did not finish')
          PY_REMOTE
