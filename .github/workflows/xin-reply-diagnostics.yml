name: Xiaoxin reply diagnostics
on:
  push:
    branches: [codex/xin-reply-diagnostics-20261119]
    paths: [.github/workflows/xin-reply-diagnostics.yml]
permissions: {}
jobs:
  diagnose:
    if: github.repository == 'yux91803-hobo/liming-work-site' && github.ref_name == 'codex/xin-reply-diagnostics-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check a real reply in an isolated Xiaoxin conversation
        env:
          XIN_OWNER_PASSWORD: ${{ secrets.XIN_OWNER_PASSWORD }}
        run: |
          python3 - <<'PY_REMOTE'
          import http.cookiejar
          import json
          import os
          import re
          import sys
          import time
          import uuid
          from urllib.error import HTTPError
          from urllib.request import HTTPCookieProcessor, HTTPRedirectHandler, Request, build_opener

          BASE='https://liming-work.com'
          PASSWORD=os.environ['XIN_OWNER_PASSWORD']

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          OPENER=build_opener(NoRedirect(),HTTPCookieProcessor(http.cookiejar.CookieJar()))

          def request(path, payload=None):
              if not path.startswith('/') or path.startswith('//'): raise ValueError('Unexpected site path')
              data=None if payload is None else json.dumps(payload).encode('utf-8')
              req=Request(BASE+path,data=data,headers={'Content-Type':'application/json','X-Xin':'1',
                                                      'Origin':BASE,'User-Agent':'Xiaoxin-reply-check'})
              try:
                  with OPENER.open(req,timeout=55) as response:
                      return response.status,response.read(2*1024*1024)
              except HTTPError as failure:
                  return failure.code,failure.read(512*1024)

          def get(path, body=None):
              status,response=request(path,body)
              try: content=json.loads(response)
              except ValueError: content={}
              return status,content

          def call(op,args=None):
              status,body=get('/api/xin/call',{'op':op,'args':args or {}})
              return status,body,body.get('data') or {}

          def wait_op(op, args, pred, seconds):
              end = time.monotonic() + seconds
              while time.monotonic() < end:
                  status, response, data = call(op, args)
                  if response.get('ok') and not data.get('error') and pred(data):
                      return data
                  if status in (400, 401, 403, 404) or data.get('error') not in {None, 'not_found'}:
                      raise RuntimeError(f'{op} failed with HTTP {status}')
                  time.sleep(2)
              raise RuntimeError(f'{op} timed out')


          def main():
              status, _ = get('/api/xin/login', {'password': PASSWORD})
              _, me = get('/api/xin/me')
              if status != 200 or not (me.get('enabled') and me.get('authed')):
                  raise RuntimeError('Xiaoxin login not confirmed')
              probe = '青柠 松果 白鹭'
              text = '这是小芯的独立联调。请只回复「'+probe+'」。不用查资料、派活或记忆。'
              data = {'agent':'codex','main':False,'clientId':'xin-reply-check-'+uuid.uuid4().hex,'text':text}
              status, response, accepted = call('send', data)
              print('SMOKE_ACCEPT', status, bool(response.get('ok') or response.get('accepted')), flush=True)
              if not (response.get('ok') or response.get('accepted')):
                  raise RuntimeError('Xiaoxin fixture was not accepted')
              if response.get('accepted'):
                  delivered = wait_op('delivery', {'id':data['clientId']}, lambda d:d.get('state') in {'delivered','failed'}, 70)
                  accepted = delivered.get('result') or {}
              sid, run = accepted.get('sid',''), accepted.get('run','')
              if accepted.get('main') or not (re.fullmatch(r's[a-z0-9]{6,26}',sid) and re.fullmatch(r'r[a-z0-9]{6,26}',run)):
                  raise RuntimeError('Isolated conversation not confirmed')
              results = {'real_reply':False,'done':False,'cleaned':False}
              try:
                  reply = wait_op('poll', {'run':run,'off':0}, lambda d:d.get('done') is True, 145)
                  events = reply.get('events') or []
                  done = next((e for e in events if e.get('t')=='done'),{})
                  model = done.get('model')
                  results.update(done=done.get('ok') is True,
                                 real_reply=any(e.get('t')=='text' and all(w in e.get('text','') for w in probe.split()) for e in events),
                                 model=model if model in {'gemini-4-hydrogen','deepseek-v4.1-flash'} else None,
                                 task_count=sum(1 for e in events if e.get('t')=='task'),
                                 round_ms=done.get('ms') if type(done.get('ms')) is int else None,
                                 timeout_fallback=done.get('frontFallback')=='timeout')
              finally:
                  if not results['done']:
                      call('stop', {'sid':sid,'run':run})
                  for _ in range(12):
                      _, response, d = call('forget', {'sid':sid})
                      if response.get('ok') and not d.get('error'):
                          results['cleaned'] = True
                          break
                      time.sleep(2)
                  print('SMOKE_RESULT', json.dumps(results,sort_keys=True), flush=True)
              if not (results['done'] and results['real_reply'] and results['cleaned'] and results['task_count']==0):
                  raise RuntimeError('Xiaoxin fixture did not complete a real isolated reply')


          if __name__=='__main__':
              try:
                  main()
              except (RuntimeError, ValueError, OSError, KeyError) as error:
                  raise SystemExit(str(error) if isinstance(error, RuntimeError) else 'Xiaoxin live check could not finish') from None
          PY_REMOTE
