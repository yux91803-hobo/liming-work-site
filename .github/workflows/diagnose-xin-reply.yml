name: Diagnose Xin reply
on:
  push:
    branches: [claude/xin-lost-reply]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: [self-hosted, box]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: 从 runner 直接读取本仓库合成浏览器检查的失败日志
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/inspect-ci-log.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failed-e2e-log
          path: .diagnostic/failed-e2e.log
          include-hidden-files: true
          retention-days: 1
