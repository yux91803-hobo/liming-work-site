name: Diagnose Xin reply
on:
  push:
    branches: [claude/xin-lost-reply]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, box]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: 001b65e157ab4eab693067b39a62feea24893056
          path: .diagnostic-opus
      - name: 合成对话对照与能力元数据（不打印聊天、回复或密钥）
        env:
          XIN_INSTABOX_API_KEY: ${{ secrets.XIN_INSTABOX_API_KEY }}
        run: python3 scripts/diagnose-xin-reply.py
