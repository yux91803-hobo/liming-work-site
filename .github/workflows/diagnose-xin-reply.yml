name: Diagnose Xin reply
on:
  push:
    branches: [claude/xin-lost-reply]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, box]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: 只读检查原生记录的布局与公开帮助（不读取聊天、不唤醒电脑）
        env:
          XIN_DIAG_MODE: native-storage
          XIN_INSTABOX_API_KEY: ${{ secrets.XIN_INSTABOX_API_KEY }}
        run: python3 scripts/diagnose-xin-reply.py
