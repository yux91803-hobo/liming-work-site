name: Preflight Xin native profile
on:
  push:
    branches: [claude/xin-lost-reply]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, box]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - name: 原生会话配置比较（不请求模型回复、不唤醒电脑）
        env:
          XIN_INSTABOX_API_KEY: ${{ secrets.XIN_INSTABOX_API_KEY }}
          XIN_DIAG_MODE: native-setup
        run: python3 scripts/diagnose-xin-reply.py
