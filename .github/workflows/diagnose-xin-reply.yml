name: Read box deployment connection evidence
on:
  push:
    branches: [claude/xin-lost-reply]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, box]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: 只读部署时段的 runner 计数（不连云电脑、不重启）
        run: python3 scripts/diagnose-box-runner.py
