# 部署流程
#   PR 到 main           → 测试站 liming-hub-staging（*.workers.dev，不绑正式域名）
#   合并到 main           → 正式站 liming-worldmap（liming-work.com）
#   手动运行（Actions 页） → 自选站点，默认只 dry-run
#
# 需要仓库 Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID
# 可选（小芯聊天，只写进正式站）：XIN_OWNER_PASSWORD（登录密码，至少 12 位）、XIN_INSTABOX_API_KEY（InstaBox 的 API key）

name: Deploy

# 同一个 PR 更新时停止旧版验证；正式发布不取消。仅可信仓库代码使用盒子 runner。
concurrency:
  group: deploy-run-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 部署到哪个站点
        type: choice
        options: [staging, production]
        default: staging
      dry_run:
        description: 只 dry-run，不真正部署
        type: boolean
        default: true

env:
  # 总开关："false" 时所有运行都只 dry-run
  DEPLOY_ENABLED: "true"
  WRANGLER: wrangler@4.151.1

permissions:
  contents: read
  actions: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  check:
    timeout-minutes: 15
    # 每次可信 main 发布都测试当前提交；PR 仅接受同仓库来源。
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main')
    runs-on: [self-hosted, box]
    steps:
      - name: 记录执行机器（无密钥）
        env:
          EXECUTOR_NAME: ${{ runner.name }}
          EXECUTOR_ENV: ${{ runner.environment }}
        run: printf 'runner=%s environment=%s\n' "$EXECUTOR_NAME" "$EXECUTOR_ENV" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 语法、资源引用和单元测试
        run: npm run check
      - name: 记录单元测试通过的代码树
        if: github.event_name == 'pull_request'
        run: node scripts/ci-proof.mjs write check
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: tested-tree-check
          path: .ci-proof/check.json
          include-hidden-files: true
          retention-days: 1
          overwrite: true

  e2e:
    timeout-minutes: 30
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main')
    runs-on: [self-hosted, box]
    steps:
      - name: 记录执行机器（无密钥）
        env:
          EXECUTOR_NAME: ${{ runner.name }}
          EXECUTOR_ENV: ${{ runner.environment }}
        run: printf 'runner=%s environment=%s\n' "$EXECUTOR_NAME" "$EXECUTOR_ENV" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安装浏览器
        run: |
          pip install playwright==1.64.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: 浏览器端到端测试（电脑、手机宽度：点击、翻页、返回、模拟器）
        run: |
          set -o pipefail
          mkdir -p test-results/e2e
          node scripts/preview.mjs --port 5173 > preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf http://localhost:5173/ > /dev/null && break; sleep 1; done
          python test/e2e/stm32_e2e.py http://localhost:5173 2>&1 | tee test-results/e2e/stm32.log
          python test/e2e/map_e2e.py http://localhost:5173 2>&1 | tee test-results/e2e/map.log
          python test/e2e/xin_runtime_e2e.py http://localhost:5173 2>&1 | tee test-results/e2e/xin-runtime.log
          python test/e2e/xin_web_e2e.py http://localhost:5173 2>&1 | tee test-results/e2e/xin-web.log
      - name: 保存浏览器检查报告（失败也保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/e2e/*.log
            preview.log
            screens/xin-web-failure-*.png
          retention-days: 1
      - name: 记录浏览器测试通过的代码树
        if: github.event_name == 'pull_request'
        run: node scripts/ci-proof.mjs write e2e
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: tested-tree-e2e
          path: .ci-proof/e2e.json
          include-hidden-files: true
          retention-days: 1
          overwrite: true

  deploy:
    timeout-minutes: 55
    needs: [check, e2e]
    # 仅可信来源，且当前提交的两套测试都成功后才能部署。
    if: >-
      always() && !cancelled() &&
      ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main')) &&
      needs.check.result == 'success' && needs.e2e.result == 'success'
    runs-on: [self-hosted, box]
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.event_name == 'push' && 'production' || 'staging') }}
      cancel-in-progress: false
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.event_name == 'push' && 'production' || 'staging') }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: 记录执行机器（无密钥）
        env:
          EXECUTOR_NAME: ${{ runner.name }}
          EXECUTOR_ENV: ${{ runner.environment }}
        run: printf 'runner=%s environment=%s\n' "$EXECUTOR_NAME" "$EXECUTOR_ENV" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 查找本次合并对应的完整 PR 验证
        if: github.event_name == 'push'
        id: checked
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const associated=await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit,{owner,repo,commit_sha:context.sha,per_page:100});
            if(associated.length===0){
              core.info('当前为直接 main 提交：check/e2e 已在本次运行完整通过，不复用 PR 凭证');
              return;
            }
            let source=null;
            for(const candidate of associated){
              const {data:p}=await github.rest.pulls.get({owner,repo,pull_number:candidate.number});
              if(p.merged && p.merge_commit_sha===context.sha && p.base.ref==='main' && p.head.repo?.full_name===`${owner}/${repo}`){source=p;break;}
            }
            if(!source)throw Error('没有对应的已合并同仓库 PR；请走 PR 或手动完整验证，停止部署');
            const {data}=await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:'deploy.yml',head_sha:source.head.sha,event:'pull_request',status:'success',per_page:20});
            let checked=null;
            for(const run of data.workflow_runs){
              if(run.conclusion!=='success'||run.head_sha!==source.head.sha)continue;
              const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id:run.id,per_page:100});
              if(['tested-tree-check','tested-tree-e2e'].every(name=>artifacts.some(a=>a.name===name&&!a.expired))){checked=run;break;}
            }
            if(!checked)throw Error('缺少完整成功的 PR 测试和测试站验证证据，停止部署');
            core.setOutput('run',String(checked.id));core.setOutput('head',source.head.sha);
            core.info(`复用 PR #${source.number} 的已通过验证，运行 ${checked.id}`);
      - name: 读取 PR 的两份验证证据
        if: github.event_name == 'push' && steps.checked.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          pattern: tested-tree-*
          merge-multiple: true
          path: .ci-proof
          run-id: ${{ steps.checked.outputs.run }}
          github-token: ${{ github.token }}
      - name: 核对正式代码与已测试代码完全相同
        if: github.event_name == 'push' && steps.checked.outputs.run != ''
        env:
          CI_CHECKED_RUN: ${{ steps.checked.outputs.run }}
          CI_CHECKED_HEAD: ${{ steps.checked.outputs.head }}
        run: node scripts/ci-proof.mjs verify

      - name: 选择站点
        run: |
          if [ "$TARGET" = production ]; then
            echo "ENV_FLAG=--env=" >> "$GITHUB_ENV"
            echo "WORKER=liming-worldmap" >> "$GITHUB_ENV"
          else
            echo "ENV_FLAG=--env=staging" >> "$GITHUB_ENV"
            echo "WORKER=liming-hub-staging" >> "$GITHUB_ENV"
          fi

      - name: Dry-run
        run: npx -y "$WRANGLER" deploy --dry-run $ENV_FLAG

      - name: 线上现状（只读）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "== 账号里的 Worker 及已执行的迁移（migration_tag）=="
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            | jq -r '.result[] | "\(.id)\tmigration_tag=\(.migration_tag // "无")\tmodified=\(.modified_on)"'
          echo
          echo "== $WORKER 最近的部署 =="
          npx -y "$WRANGLER" deployments list --name "$WORKER" | tail -40

      - name: 记录正式站回滚版本
        id: baseline
        if: env.DEPLOY_ENABLED == 'true' && env.DRY_RUN != 'true' && env.TARGET == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          baseline_version=$(curl -fsS --retry 3 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/liming-worldmap/deployments" \
            | jq -er 'if .success == true then .result.deployments[0].versions else error("读取当前部署失败") end
              | if length == 1 and .[0].percentage == 100 then .[0].version_id else error("当前不是单版本部署，停止发布") end
              | select(test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"))')
          echo "version=$baseline_version" >> "$GITHUB_OUTPUT"
          echo "已记录发布前的正式站版本：$baseline_version"

      - name: 部署
        id: deploy
        if: env.DEPLOY_ENABLED == 'true' && env.DRY_RUN != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y "$WRANGLER" deploy $ENV_FLAG | tee deploy.log
          if [ "$TARGET" = production ]; then
            echo "BASE=https://liming-work.com" >> "$GITHUB_ENV"
          else
            url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
            [ -n "$url" ] || { echo "没从部署输出里找到 workers.dev 地址"; exit 1; }
            echo "BASE=$url" >> "$GITHUB_ENV"
          fi

      # 回滚后先部署新代码再写密钥，避免 Cloudflare 拒绝编辑未部署的最新版本。
      - name: 小芯聊天的密钥（只写正式站；没配就跳过，功能保持关闭）
        if: steps.deploy.outcome == 'success' && env.TARGET == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          XIN_OWNER_PASSWORD: ${{ secrets.XIN_OWNER_PASSWORD }}
          XIN_INSTABOX_API_KEY: ${{ secrets.XIN_INSTABOX_API_KEY }}
        run: |
          if [ -z "$XIN_OWNER_PASSWORD" ] || [ -z "$XIN_INSTABOX_API_KEY" ]; then
            echo "没配 XIN_OWNER_PASSWORD / XIN_INSTABOX_API_KEY：小芯聊天保持关闭"; exit 0
          fi
          if [ ${#XIN_OWNER_PASSWORD} -lt 12 ]; then echo "::warning::XIN_OWNER_PASSWORD 少于 12 位，Worker 不会打开小芯聊天"; fi
          jq -n --arg a "$XIN_OWNER_PASSWORD" --arg b "$XIN_INSTABOX_API_KEY" '{OWNER_PASSWORD: $a, INSTABOX_API_KEY: $b}' \
            | npx -y "$WRANGLER" secret bulk $ENV_FLAG --name liming-worldmap

      - name: 冒烟检查
        id: smoke
        if: steps.deploy.outcome == 'success'
        run: |
          sleep 5
          fail=0
          for p in / /tools/stm32/ /tools/map/ /tools/map/map.js /tools/map/geo.mjs /xin/chat.js /api/xin/me; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$BASE$p")
            echo "$code $BASE$p"
            [ "$code" = 200 ] || fail=1
          done
          echo "小芯聊天：$(curl -s "$BASE/api/xin/me")"
          exit $fail

      - uses: actions/setup-python@v6
        if: steps.smoke.outcome == 'success' && env.TARGET == 'production'
        with:
          python-version: "3.12"

      - name: 安装正式站联调浏览器
        if: steps.smoke.outcome == 'success' && env.TARGET == 'production'
        run: |
          pip install playwright==1.64.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi

      - name: 正式站登录、真实模型、后台任务、奶龙网页和文件下载
        id: live_xin
        if: steps.smoke.outcome == 'success' && env.TARGET == 'production'
        timeout-minutes: 35
        env:
          XIN_OWNER_PASSWORD: ${{ secrets.XIN_OWNER_PASSWORD }}
        run: python scripts/test-xin-live.py

      - name: 正式站检查失败，回滚到发布前记录的版本
        if: failure() && steps.deploy.outcome == 'success' && env.TARGET == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASELINE_VERSION: ${{ steps.baseline.outputs.version }}
        run: |
          test -n "$BASELINE_VERSION"
          npx -y "$WRANGLER" rollback "$BASELINE_VERSION" --name liming-worldmap --yes --message "上线验证失败，回滚到发布前版本"
