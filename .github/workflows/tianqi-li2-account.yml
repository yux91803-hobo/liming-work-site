name: Tianqi plugin migration
on:
  push:
    branches: [codex/tianqi-li2-account-20261118]
    paths: [.github/workflows/tianqi-li2-account.yml]
permissions: {}
jobs:
  tianqi:
    if: github.repository == 'yux91803-hobo/liming-work-site' && github.ref_name == 'codex/tianqi-li2-account-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Verify the inserted REA plugin enters a local Harness request
        env:
          LI2_API_KEY: ${{ secrets.XIN_TQ_INSTABOX_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import quote
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          API='https://api.instabox.sh'
          REMOTE='import http.client\nimport http.server\nimport json\nimport os\nimport re\nimport subprocess\nimport tempfile\nimport threading\nfrom functools import partial\nfrom pathlib import Path\n\nHOME=Path(\'/data/home\')\nBIN=Path(\'/data/apps/deepseek-harness/runtime/bin\')\nDSH=HOME/\'.local/bin/dsh\'\nif json.loads((HOME/\'.xin/kernel.env.json\').read_text()).get(\'XIN_ROLE\')!=\'tianqi\':\n    raise SystemExit(\'Unexpected target role\')\n\ndef gateway(path, key=\'\'):\n    con=http.client.HTTPConnection(\'127.0.0.1\',8788,timeout=7)\n    try:\n        con.request(\'GET\',path,headers={\'Authorization\':\'Bearer \'+key} if key else {})\n        reply=con.getresponse()\n        doc=json.loads(reply.read(512*1024))\n        return reply.status,doc\n    finally:\n        con.close()\n\nresult={}\nhealth,doc=gateway(\'/health\')\nkeyfile=HOME/\'.xin/harness.key\'\nkey=keyfile.read_text().strip() if keyfile.is_file() and not keyfile.is_symlink() else \'\'\nresult.update(gateway_health=health,gateway_accounts=doc.get(\'accounts\'),\n              client_key_present=bool(key),gateway_no_key_http=gateway(\'/v1/models\')[0],\n              gateway_client_http=gateway(\'/v1/models\',key)[0] if key else None)\n\nclass Capture(http.server.BaseHTTPRequestHandler):\n    def __init__(self, seen, *args, **kwargs):\n        self.seen=seen\n        super().__init__(*args,**kwargs)\n    def log_message(self,*args):\n        pass\n    def do_POST(self):\n        size=int(self.headers.get(\'Content-Length\',0))\n        if self.path!=\'/v1/responses\' or not 0<size<8*1024*1024:\n            self.send_error(400)\n            return\n        body=json.loads(self.rfile.read(size))\n        tools=body.get(\'tools\',[])\n        names=[t.get(\'name\',\'\') for t in tools]\n        self.seen.append(sum(name.startswith(\'mcp__rea__\') for name in names))\n        # Stop after proving the real tool list in the request. No inference call leaves li2.\n        response=b\'{"error":{"message":"isolated tool catalog check finished","type":"invalid_request_error"}}\'\n        self.send_response(400)\n        self.send_header(\'Content-Type\',\'application/json\')\n        self.send_header(\'Content-Length\',str(len(response)))\n        self.end_headers()\n        self.wfile.write(response)\n\nwith tempfile.TemporaryDirectory(prefix=\'tianqi-mcp-check-\',dir=\'/data/tmp\') as name:\n    work=Path(name)\n    dshhome=work/\'.dsh\'\n    (dshhome/\'profiles\').mkdir(parents=True)\n    (dshhome/\'profiles/headless\').symlink_to(HOME/\'.dsh/profiles/headless\',target_is_directory=True)\n    seen=[]\n    with http.server.HTTPServer((\'127.0.0.1\',0),partial(Capture,seen)) as srv:\n        daemon=threading.Thread(target=srv.serve_forever,daemon=True)\n        daemon.start()\n        try:\n            env={\'PATH\':str(BIN)+\':/usr/bin:/bin\',\'HOME\':str(work),\'DSH_HOME\':str(dshhome),\n                 \'LANG\':\'C.UTF-8\',\'TQ_TEST_KEY\':\'local-probe-placeholder\'}\n            profile=work/\'model.yml\'\n            profile.write_text(\'\'\'- id: llm-pi-ai\n  config:\n    providers:\n      tianqi-smoke:\n        displayName: Tianqi local test\n        apiKeyEnv: TQ_TEST_KEY\n        api: openai-responses\n        baseURL: "http://127.0.0.1:%d/v1"\n        models:\n          - id: tianqi-smoke\n            name: Local catalog test\n            contextWindow: 1000000\n            reasoningEfforts:\n              low: low\n- id: agent-default-model\n  config:\n    provider: tianqi-smoke\n    model: tianqi-smoke\n    reasoningEffort: low\n- id: dsh-purge\n  config:\n    enabled: false\n\'\'\' % srv.server_port)\n            mcp=work/\'rea.yml\'\n            mcp.write_text(\'\'\'- insert:\n    - id: mcp-rea\n      name: "@deepseek-ai/dsh-mcp-client"\n      config:\n        serverName: rea\n        transport: stdio\n        command: "/data/home/.local/bin/tianqi-rea-mcp"\n        startupTimeoutMs: 30000\n        toolCallTimeoutMs: 450000\n\'\'\')\n            base=[DSH,\'--profile\',\'headless\',\'--patch\',profile]\n            for label,patches in ((\'off\',[]),(\'on\',[\'--patch\',mcp])):\n                before=len(seen)\n                check=subprocess.run(base+patches+[\'--json\',\'只回复一个字\'],env=env,cwd=work,\n                                     stdin=subprocess.DEVNULL,capture_output=True,timeout=42)\n                categories=(check.stderr+check.stdout).decode(errors=\'replace\')\n                result[\'rea_\'+label+\'_tools\']=seen[-1] if len(seen)>before else None\n                result[\'rea_\'+label+\'_mcp_loaded\']=\'mcp__rea__\' in categories\n                result[\'rea_\'+label+\'_boot_error\']=any(s in categories for s in [\'no_agent\',\'ENOENT\',\'module not found\',\'Failed to load\'])\n        finally:\n            srv.shutdown()\n            daemon.join(timeout=4)\nprint(json.dumps(result,sort_keys=True))\n'
          key=os.environ['LI2_API_KEY']

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None

          def main():
              opener=build_opener(NoRedirect())
              def req(path,body=None):
                  q=Request(API+path,data=json.dumps(body).encode() if body is not None else None,
                            headers={'X-API-Key':key,'Content-Type':'application/json'})
                  with opener.open(q,timeout=115) as r:
                      return json.load(r)
              ids=[r['id'] for r in req('/v1/machines')['machines'] if r.get('name')=='li2']
              if len(ids)!=1: raise RuntimeError('Unexpected target selection')
              run=req('/v1/machines/'+quote(ids[0],safe='')+'/exec',
                      {'argv':['/usr/bin/python3','-c',REMOTE],'timeoutSeconds':105})
              if run.get('exitCode')!=0: raise RuntimeError('Isolated Tianqi verification did not complete')
              proof=json.loads(run['stdout'])
              print('TIANQI_HARNESS '+json.dumps(proof,sort_keys=True),flush=True)
              if proof['rea_off_tools']!=0 or not proof.get('rea_on_tools'):
                  raise RuntimeError('Tianqi MCP registration did not match the switches')

          if __name__=='__main__':
              try: main()
              except (ValueError,KeyError,RuntimeError) as error: raise SystemExit(str(error)) from None
          PY
