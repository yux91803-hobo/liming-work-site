name: Tianqi plugin migration
on:
  push:
    branches: [codex/tianqi-li2-account-20261118]
    paths: [.github/workflows/tianqi-li2-account.yml]
permissions: {}
jobs:
  tianqi:
    if: github.repository == 'yux91803-hobo/liming-work-site' && github.ref_name == 'codex/tianqi-li2-account-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Match Tianqi to its existing gateway account region
        env:
          LI2_API_KEY: ${{ secrets.XIN_TQ_INSTABOX_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import quote
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          API='https://api.instabox.sh'
          REMOTE='import http.client\nimport json\nimport os\nimport re\nimport subprocess\nimport tempfile\nimport time\nfrom pathlib import Path\n\nHOME=Path(\'/data/home\')\nXIN=HOME/\'.xin\'\nSERVICE=\'workbuddy-gateway.service\'\nCONF=Path(\'/etc/systemd/system\')/(SERVICE+\'.d\')/\'61-liming-tianqi-realm.conf\'\nif json.loads((XIN/\'kernel.env.json\').read_text()).get(\'XIN_ROLE\')!=\'tianqi\':\n    raise SystemExit(\'Unexpected target role\')\nKEY=(XIN/\'harness.key\').read_text().strip()\n\ndef read(route,payload=None,realm=None):\n    con=http.client.HTTPConnection(\'127.0.0.1\',8788,timeout=45)\n    try:\n        raw=None if payload is None else json.dumps(payload).encode()\n        headers={\'Authorization\':\'Bearer \'+KEY,\'Content-Type\':\'application/json\'}\n        if realm: headers[\'X-Realm\']=realm\n        con.request(\'GET\' if raw is None else \'POST\',route,body=raw,headers=headers)\n        result=con.getresponse()\n        return result.status,json.loads(result.read(512*1024))\n    finally: con.close()\n\ndef summary():\n    code,health=read(\'/health\')\n    doc={k:health.get(k) for k in (\'realm\',\'accounts\',\'accounts_ready\',\'accounts_ready_current_realm\')}\n    doc[\'http\']=code\n    for k in (\'accounts_by_realm\',\'accounts_ready_by_realm\'):\n        doc[k]={realm:n for realm,n in (health.get(k) or {}).items() if realm in {\'cn\',\'intl\'} and type(n) is int}\n    expiry=health.get(\'expires_at\')\n    if isinstance(expiry,(int,float)):\n        if expiry>1e11: expiry/=1000\n        doc[\'presented_account_expired\']=expiry<time.time()\n    return doc\n\ndef root(*argv, optional=False):\n    prefix=[\'/usr/bin/sudo\',\'-n\'] if os.geteuid() else []\n    got=subprocess.run(prefix+list(map(str,argv)),stdin=subprocess.DEVNULL,capture_output=True,timeout=35)\n    if got.returncode and not optional: raise RuntimeError(\'Could not apply the loopback gateway realm\')\n\ndef completion(realm=None):\n    status,doc=read(\'/v1/responses\',{\'model\':\'deepseek-v4.1-flash\',\'input\':\'只回复一个字：好\',\n                                   \'stream\':False,\'max_output_tokens\':32},realm)\n    error=doc.get(\'error\',{})\n    msg=error.get(\'message\',\'\') if isinstance(error,dict) else \'\'\n    match=re.search(r"no usable account for realm \'(intl|cn)\'",str(msg))\n    return {\'status\':status,\'replied\':status==200 and bool(doc.get(\'output\')),\n            \'missing_realm\':match[1] if match else None,\n            \'region_has_no_account\':\'该区域没有任何账号\' in str(msg)}\n\ndef main():\n    first=summary()\n    proof={\'before\':first,\'changed_realm\':False}\n    available=[r for r,n in first[\'accounts_ready_by_realm\'].items() if n==1]\n    if first[\'accounts\']==1 and first[\'realm\'] in {\'cn\',\'intl\'} and len(available)==1 and available[0]!=first[\'realm\']:\n        realm=available[0]\n        proof[\'explicit_realm\']=completion(realm)\n        if proof[\'explicit_realm\'][\'replied\'] and not CONF.exists() and not CONF.is_symlink():\n            with tempfile.TemporaryDirectory(prefix=\'tianqi-gateway-realm-\',dir=\'/data/tmp\') as tmp:\n                f=Path(tmp)/\'realm.conf\'\n                f.write_text(\'[Service]\\nEnvironment=WB_PROXY_DEFAULT_REALM=\'+realm+\'\\n\')\n                written=False\n                try:\n                    root(\'/usr/bin/install\',\'-m\',\'0644\',f,CONF)\n                    written=True\n                    root(\'systemctl\',\'daemon-reload\')\n                    root(\'systemctl\',\'restart\',SERVICE)\n                    for _ in range(20):\n                        try:\n                            proof[\'after\']=summary()\n                            if proof[\'after\'][\'realm\']==realm: break\n                        except (OSError,ValueError,http.client.HTTPException): pass\n                        time.sleep(.5)\n                    else: raise RuntimeError(\'Explicit live realm remained in place\')\n                    proof[\'default_realm_reply\']=completion()\n                    if not proof[\'default_realm_reply\'][\'replied\']: raise RuntimeError(\'The matched default realm did not answer\')\n                    proof[\'changed_realm\']=True\n                except (RuntimeError,OSError,ValueError,http.client.HTTPException,subprocess.TimeoutExpired) as error:\n                    proof[\'recovered\']=type(error).__name__\n                    if written:\n                        root(\'/usr/bin/rm\',\'-f\',\'--\',CONF,optional=True)\n                        root(\'systemctl\',\'daemon-reload\',optional=True)\n                        root(\'systemctl\',\'restart\',SERVICE,optional=True)\n    elif first.get(\'accounts_ready_current_realm\'):\n        proof[\'default_realm_reply\']=completion()\n    print(json.dumps(proof,sort_keys=True))\n\nif __name__==\'__main__\':\n    try: main()\n    except (OSError,ValueError,http.client.HTTPException,subprocess.TimeoutExpired) as error:\n        raise SystemExit(\'Gateway route check controlled failure: \'+type(error).__name__) from None\n'
          key=os.environ['LI2_API_KEY']

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None

          def main():
              opener=build_opener(NoRedirect())
              def req(path,body=None):
                  q=Request(API+path,data=json.dumps(body).encode() if body is not None else None,
                            headers={'X-API-Key':key,'Content-Type':'application/json'})
                  with opener.open(q,timeout=185) as r:
                      return json.load(r)
              ids=[r['id'] for r in req('/v1/machines')['machines'] if r.get('name')=='li2']
              if len(ids)!=1: raise RuntimeError('Unexpected target selection')
              run=req('/v1/machines/'+quote(ids[0],safe='')+'/exec',
                      {'argv':['/usr/bin/python3','-c',REMOTE],'timeoutSeconds':170})
              if run.get('exitCode')!=0: raise RuntimeError('Isolated Tianqi verification did not complete')
              proof=json.loads(run['stdout'])
              print('TIANQI_GATEWAY_REALM '+json.dumps(proof,sort_keys=True),flush=True)

          if __name__=='__main__':
              try: main()
              except (ValueError,KeyError,RuntimeError) as error: raise SystemExit(str(error)) from None
          PY
