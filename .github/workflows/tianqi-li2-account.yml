name: Tianqi plugin migration
on:
  push:
    branches: [codex/tianqi-li2-account-20261118]
    paths: [.github/workflows/tianqi-li2-account.yml]
permissions: {}
jobs:
  tianqi:
    if: github.repository == 'yux91803-hobo/liming-work-site' && github.ref_name == 'codex/tianqi-li2-account-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Connect Tianqi to its existing loopback gateway and verify a reply
        env:
          LI2_API_KEY: ${{ secrets.XIN_TQ_INSTABOX_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import quote
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          API='https://api.instabox.sh'
          REMOTE='import http.client\nimport json\nimport os\nimport re\nimport secrets\nimport stat\nimport subprocess\nimport tempfile\nimport time\nfrom pathlib import Path\n\nHOME=Path(\'/data/home\')\nXIN=HOME/\'.xin\'\nBIN=Path(\'/data/apps/deepseek-harness/runtime/bin\')\nDSH=HOME/\'.local/bin/dsh\'\nSERVICE=\'workbuddy-gateway.service\'\nDROP=Path(\'/etc/systemd/system\')/(SERVICE+\'.d\')\nUNIT=DROP/\'60-liming-tianqi-client.conf\'\nENVFILE=DROP/\'liming-tianqi-client.env\'\nKEY=XIN/\'harness.key\'\nPROGRAM=Path(\'/data/workbuddy-gateway/current/wb_proxy.py\')\nBASE_ENV={\'HOME\':str(HOME),\'PATH\':str(BIN)+\':/usr/local/bin:/usr/bin:/bin\',\'LANG\':\'C.UTF-8\'}\n\ndef call(path, key=\'\', as_json=False):\n    conn=http.client.HTTPConnection(\'127.0.0.1\',8788,timeout=8)\n    try:\n        conn.request(\'GET\',path,headers={\'Authorization\':\'Bearer \'+key} if key else {})\n        r=conn.getresponse()\n        raw=r.read(1024*1024)\n        return (r.status,json.loads(raw)) if as_json else r.status\n    finally: conn.close()\n\ndef root(*args, optional=False):\n    cmd=([\'/usr/bin/sudo\',\'-n\'] if os.geteuid() else [])+list(map(str,args))\n    result=subprocess.run(cmd,env=BASE_ENV,stdin=subprocess.DEVNULL,capture_output=True,timeout=35)\n    if result.returncode and not optional: raise RuntimeError(\'Local service configuration command did not complete\')\n    return result\n\ndef account_count():\n    code,doc=call(\'/health\',as_json=True)\n    return doc.get(\'accounts\') if code==200 else None\n\ndef active_key():\n    result=root(\'systemctl\',\'show\',SERVICE,\'--property=MainPID\',\'--value\')\n    pid=int(result.stdout.decode().strip())\n    if pid<2: raise RuntimeError(\'Gateway service is inactive\')\n    incoming=root(\'/usr/bin/cat\',f\'/proc/{pid}/environ\').stdout\n    env=dict(v.split(b\'=\',1) for v in incoming.split(b\'\\0\') if b\'=\' in v)\n    key=env.get(b\'API_KEY\') or env.get(b\'WB_PROXY_KEY\') or b\'\'\n    return key.decode().strip()\n\ndef install_key(key):\n    with tempfile.NamedTemporaryFile(prefix=\'.harness-key-\',dir=XIN,delete=False,mode=\'w\') as f:\n        tmp=Path(f.name)\n        f.write(key+\'\\n\')\n        f.flush()\n        os.fsync(f.fileno())\n    try: os.link(tmp,KEY)\n    finally: tmp.unlink()\n\ndef connect(work):\n    accounts=account_count()\n    if type(accounts) is not int or accounts<1:\n        raise RuntimeError(\'No configured gateway account was reported\')\n    if KEY.exists() or KEY.is_symlink():\n        info=KEY.lstat()\n        if not stat.S_ISREG(info.st_mode) or info.st_uid!=os.getuid() or info.st_mode&0o077:\n            raise RuntimeError(\'The existing Harness key file has unexpected ownership or mode\')\n        key=KEY.read_text().strip()\n        if not key or call(\'/v1/models\',key)!=200: raise RuntimeError(\'The existing Harness key does not authenticate\')\n        return key,\'existing\'\n    configured=active_key()\n    if configured:\n        if call(\'/v1/models\',configured)!=200: raise RuntimeError(\'The service key does not authenticate\')\n        install_key(configured)\n        return configured,\'reused-service-key\'\n    if call(\'/v1/models\')!=200: raise RuntimeError(\'The service needs authentication outside its configured environment\')\n    service=root(\'systemctl\',\'show\',SERVICE,\'--property=ExecStart\',\'--value\').stdout.decode()\n    if (str(PROGRAM) not in service or \'--host 127.0.0.1\' not in service or\n        \'--port 8788\' not in service or \'--api-key\' in service or \'WB_PROXY_KEY\' not in PROGRAM.read_text()):\n        raise RuntimeError(\'Gateway service does not match the installed loopback gateway\')\n    if UNIT.exists() or ENVFILE.exists() or UNIT.is_symlink() or ENVFILE.is_symlink():\n        raise RuntimeError(\'A local gateway client configuration already exists\')\n    key=secrets.token_urlsafe(42)\n    env=work/\'client.env\'\n    conf=work/\'client.conf\'\n    env.write_text(\'WB_PROXY_KEY=\'+key+\'\\n\')\n    env.chmod(0o600)\n    conf.write_text(\'[Service]\\nEnvironmentFile=\'+str(ENVFILE)+\'\\n\')\n    published=[]\n    try:\n        root(\'/usr/bin/install\',\'-d\',\'-m\',\'0755\',DROP)\n        root(\'/usr/bin/install\',\'-m\',\'0600\',env,ENVFILE)\n        published.append(ENVFILE)\n        root(\'/usr/bin/install\',\'-m\',\'0644\',conf,UNIT)\n        published.append(UNIT)\n        root(\'systemctl\',\'daemon-reload\')\n        root(\'systemctl\',\'restart\',SERVICE)\n        for _ in range(18):\n            try:\n                if account_count()==accounts and call(\'/v1/models\')==401 and call(\'/v1/models\',key)==200:\n                    break\n            except (OSError,ValueError,http.client.HTTPException): pass\n            time.sleep(.5)\n        else: raise RuntimeError(\'The protected gateway did not become ready\')\n        install_key(key)\n        return key,\'created-local-client-key\'\n    except Exception:\n        if published:\n            root(\'/usr/bin/rm\',\'-f\',\'--\',*published,optional=True)\n            root(\'systemctl\',\'daemon-reload\',optional=True)\n            root(\'systemctl\',\'restart\',SERVICE,optional=True)\n        raise\n\ndef probe(work,key):\n    # Disposable Harness scope with the installed profile and a single short reply.\n    home=work/\'session-home\'\n    profile=home/\'.dsh/profiles\'\n    profile.mkdir(parents=True)\n    (profile/\'headless\').symlink_to(HOME/\'.dsh/profiles/headless\',target_is_directory=True)\n    patch=work/\'gateway.yml\'\n    patch.write_text(\'\'\'- id: llm-pi-ai\n  config:\n    providers:\n      xin-gateway:\n        displayName: WorkBuddy\n        apiKeyEnv: XIN_HARNESS_KEY\n        api: openai-responses\n        baseURL: "http://127.0.0.1:8788/v1"\n        models:\n          - id: deepseek-v4.1-flash\n            name: DeepSeek V4.1 Flash\n            contextWindow: 1000000\n            reasoningEfforts:\n              off: none\n              low: low\n              high: high\n              max: max\n- id: agent-default-model\n  config:\n    provider: xin-gateway\n    model: deepseek-v4.1-flash\n    reasoningEffort: off\n- id: system-prompt\n  config:\n    personaPrefix: "你叫天启。"\n- id: dsh-purge\n  config:\n    enabled: true\n\'\'\')\n    env=dict(BASE_ENV,HOME=str(home),DSH_HOME=str(home/\'.dsh\'),\n             XIN_HARNESS_KEY=key,DSH_PERMISSION_MODE=\'danger-full-access\')\n    try:\n        check=subprocess.run([DSH,\'--profile\',\'headless\',\'--patch\',patch,\'--json\',\'只回复一个字：好\'],\n                             cwd=work,env=env,stdin=subprocess.DEVNULL,capture_output=True,timeout=80)\n    except subprocess.TimeoutExpired:\n        return {\'real_reply\':False,\'reply_code\':\'TIMEOUT\'}\n    reports=[]\n    for line in check.stdout.splitlines():\n        try:\n            val=json.loads(line)\n            if isinstance(val,dict) and val.get(\'type\')==\'final\': reports.append(val)\n        except ValueError: continue\n    last=reports[-1] if reports else {}\n    reason=last.get(\'reason\') or {}\n    code=(reason.get(\'error\') or {}).get(\'code\') or reason.get(\'kind\') or \'NO_FINAL\'\n    return {\'real_reply\':check.returncode==0 and bool((last.get(\'text\') or \'\').strip()),\n            \'reply_code\':code if re.fullmatch(r\'[a-zA-Z_0-9-]{1,64}\',str(code)) else \'UNKNOWN\'}\n\ndef main():\n    role=json.loads((XIN/\'kernel.env.json\').read_text()).get(\'XIN_ROLE\')\n    if role!=\'tianqi\' or Path(home_dir()).resolve()!=HOME:\n        raise RuntimeError(\'Unexpected Tianqi machine role\')\n    with tempfile.TemporaryDirectory(prefix=\'tianqi-gateway-link-\',dir=\'/data/tmp\') as temporary:\n        work=Path(temporary)\n        key,action=connect(work)\n        outcome={\'action\':action,\'accounts\':account_count(),\'gateway_with_key\':call(\'/v1/models\',key),\n                 \'gateway_without_key\':call(\'/v1/models\'),\'client_key_mode\':oct(stat.S_IMODE(KEY.stat().st_mode))}\n        outcome.update(probe(work,key))\n        print(json.dumps(outcome,sort_keys=True))\n\ndef home_dir():\n    return os.path.expanduser(\'~\')\n\nif __name__==\'__main__\':\n    try: main()\n    except RuntimeError as error: raise SystemExit(str(error)) from None\n    except (OSError,ValueError,http.client.HTTPException,subprocess.TimeoutExpired) as error:\n        raise SystemExit(\'Local gateway configuration failed: \'+type(error).__name__) from None\n'
          key=os.environ['LI2_API_KEY']

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None

          def main():
              opener=build_opener(NoRedirect())
              def req(path,body=None):
                  q=Request(API+path,data=json.dumps(body).encode() if body is not None else None,
                            headers={'X-API-Key':key,'Content-Type':'application/json'})
                  with opener.open(q,timeout=237) as r:
                      return json.load(r)
              ids=[r['id'] for r in req('/v1/machines')['machines'] if r.get('name')=='li2']
              if len(ids)!=1: raise RuntimeError('Unexpected target selection')
              run=req('/v1/machines/'+quote(ids[0],safe='')+'/exec',
                      {'argv':['/usr/bin/python3','-c',REMOTE],'timeoutSeconds':220})
              if run.get('exitCode')!=0: raise RuntimeError('Tianqi gateway connection did not complete')
              proof=json.loads(run['stdout'])
              print('TIANQI_GATEWAY '+json.dumps(proof,sort_keys=True),flush=True)
              if not proof.get('real_reply'):
                  raise RuntimeError('Tianqi gateway did not complete a model reply')

          if __name__=='__main__':
              try: main()
              except (ValueError,KeyError,RuntimeError) as error: raise SystemExit(str(error)) from None
          PY
