name: Tianqi plugin migration
on:
  push:
    branches: [codex/tianqi-li2-account-20261118]
    paths: [.github/workflows/tianqi-li2-account.yml]
permissions: {}
jobs:
  tianqi:
    if: github.repository == 'yux91803-hobo/liming-work-site' && github.ref_name == 'codex/tianqi-li2-account-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Install the pinned REA program with isolated npm configuration on li2
        env:
          LI2_API_KEY: ${{ secrets.XIN_TQ_INSTABOX_API_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import tarfile
          import tempfile
          import time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote, urlencode
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          API='https://api.instabox.sh'
          STAGE='/data/tmp/tianqi-plugin-stage'
          REMOTE='import asyncio\nimport fcntl\nimport hashlib\nimport json\nimport os\nimport re\nimport shutil\nimport stat\nimport subprocess\nimport sys\nimport tarfile\nimport tempfile\nimport zipfile\nfrom pathlib import Path, PurePosixPath\n\nHOME = Path(\'/data/home\')\nDEST = Path(\'/data/apps/tianqi-plugins\')\nHARNESS = Path(\'/data/apps/deepseek-harness\')\nMODULES = HARNESS/\'tui-host/node_modules\'\nBIN = HARNESS/\'runtime/bin\'\nDSH = HOME/\'.local/bin/dsh\'\nPROFILE = HOME/\'.dsh/profiles/headless/package.json\'\nPURGE = \'1.6.98\'\nPURGE_HASH = \'c26291aca10290fbf62d4e03dbf111cbfeb1e19976dac4e8c97501c765d90b46\'\nREA = \'6.9.0\'\nJAVA = Path(\'/usr/lib/jvm/java-21-openjdk-amd64\')\nGHIDRA_NAME = \'ghidra_12.1.4_PUBLIC\'\nGHIDRA_URL = \'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip\'\nGHIDRA_HASH = \'ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db\'\nLAUNCHER = HOME/\'.local/bin/tianqi-rea-mcp\'\nSTAGE = Path(\'/data/tmp/tianqi-plugin-stage\')\nSTATUS = STAGE/\'progress.json\'\nENV = {\'PATH\': str(BIN)+\':/usr/local/bin:/usr/bin:/bin\',\'HOME\':str(HOME),\n       \'JAVA_HOME\':str(JAVA),\'LANG\':\'C.UTF-8\',\n       \'npm_config_userconfig\':str(STAGE/\'npm-user.ini\'),\'npm_config_globalconfig\':str(STAGE/\'npm-global.ini\'),\n       \'npm_config_cache\':str(STAGE/\'npm-cache\'),\'CI\':\'1\'}\nphase = \'preflight\'\nresult = {}\n\n\ndef atomic(target, contents, mode=0o600, replace=True):\n    tmp=target.with_name(\'.\'+target.name+\'.\'+str(os.getpid())+\'.tmp\')\n    with os.fdopen(os.open(tmp,os.O_WRONLY|os.O_CREAT|os.O_EXCL,mode),\'w\') as f:\n        f.write(contents)\n    try:\n        if replace: os.replace(tmp,target)\n        else: os.link(tmp,target)\n    finally:\n        tmp.unlink(missing_ok=True)\n\n\ndef progress(name, **details):\n    global phase\n    phase = name\n    atomic(STATUS, json.dumps(dict(phase=name, **result, **details),sort_keys=True))\n\n\ndef run(argv, *, timeout=60, root=False, cwd=STAGE):\n    if root and os.geteuid(): argv=[\'/usr/bin/sudo\',\'-n\',*argv]\n    proc = subprocess.run(argv,cwd=cwd,env=ENV,stdin=subprocess.DEVNULL,capture_output=True,timeout=timeout)\n    if proc.returncode:\n        err=(proc.stdout+proc.stderr).decode(errors=\'replace\')\n        categories=sorted(set(re.findall(r\'\\b(?:ERR_[A-Z_]+|E[A-Z0-9]{3,14}|error|failed|unsupported|missing|required|ENOENT)\\b\',err,re.I)))\n        raise RuntimeError(f\'{Path(argv[0]).name} exited {proc.returncode} ({",".join(categories[:12])})\')\n    return proc.stdout\n\n\ndef assert_role():\n    if json.loads((HOME/\'.xin/kernel.env.json\').read_text()).get(\'XIN_ROLE\')!=\'tianqi\':\n        raise RuntimeError(\'Unexpected target role\')\n    if (PROFILE.parent/\'node_modules\').resolve()!=MODULES or not (BIN/\'node\').is_file():\n        raise RuntimeError(\'Unexpected Tianqi Harness installation layout\')\n    version=run([DSH,\'--version\']).decode()\n    if \'0.2.2-rc.3\' not in version: raise RuntimeError(\'Unexpected Harness version\')\n\n\ndef checksum(path):\n    with path.open(\'rb\') as f: return hashlib.file_digest(f,\'sha256\').hexdigest()\n\n\ndef install_purge(work):\n    progress(\'purge\')\n    pack=STAGE/f\'purge-{PURGE}.tgz\'\n    if checksum(pack)!=PURGE_HASH: raise RuntimeError(\'Staged Purge checksum mismatch\')\n    archive=DEST/f\'dsh-purge-community-{PURGE}.tgz\'\n    target=MODULES/\'dsh-purge-community\'\n    original=PROFILE.read_text()\n    profile=json.loads(original)\n    deps=profile.setdefault(\'dependencies\',{})\n    bundles=profile[\'dsh\'][\'profile\'][\'bundles\']\n    wanted=\'file:\'+str(archive)\n    if target.exists() and (deps.get(\'dsh-purge-community\')!=wanted or \'dsh-purge-community\' not in bundles):\n        raise RuntimeError(\'A separate Purge installation is already present\')\n    if archive.exists() and checksum(archive)!=PURGE_HASH:\n        raise RuntimeError(\'Existing Purge archive checksum mismatch\')\n    old_file=PROFILE.with_name(\'package.json.before-tianqi-purge-1.6.98\')\n    if not old_file.exists(): atomic(old_file,original,replace=False)\n    change=False\n    try:\n        if not target.exists():\n            unpack=work/\'purge\'\n            unpack.mkdir()\n            with tarfile.open(pack,\'r:gz\') as tar:\n                members=tar.getmembers()\n                for item in members:\n                    p=PurePosixPath(item.name)\n                    if not p.parts or p.parts[0]!=\'package\' or \'..\' in p.parts or not (item.isfile() or item.isdir()):\n                        raise RuntimeError(\'Purge archive contains an unsupported entry\')\n                tar.extractall(unpack,filter=\'data\')\n            data=json.loads((unpack/\'package/package.json\').read_text())\n            if data.get(\'name\')!=\'dsh-purge-community\' or data.get(\'version\')!=PURGE:\n                raise RuntimeError(\'Wrong Purge package\')\n            for dep in (\'yaml\',\'@deepseek-ai/cordis\'):\n                if not (MODULES/dep/\'package.json\').is_file():\n                    raise RuntimeError(\'Missing Purge dependency \'+dep)\n            if not archive.exists(): shutil.copyfile(pack,archive)\n            (unpack/\'package\').rename(target)\n            change=True\n            deps[\'dsh-purge-community\']=wanted\n            if \'dsh-purge-community\' not in bundles: bundles.append(\'dsh-purge-community\')\n            atomic(PROFILE,json.dumps(profile,indent=2)+\'\\n\',0o644)\n        data=json.loads((target/\'package.json\').read_text())\n        if data.get(\'version\')!=PURGE: raise RuntimeError(\'Installed Purge version mismatch\')\n        config=run([DSH,\'--profile\',\'headless\',\'--dump-default-config\'],timeout=35)\n        if b\'dsh-purge\' not in config: raise RuntimeError(\'Harness did not load the Purge configuration\')\n    except Exception:\n        if change:\n            atomic(PROFILE,original,0o644)\n            target.rename(work/\'purge-failed\')\n        raise\n    result[\'purge_version\']=PURGE\n    result[\'purge_profile\']=True\n\n\ndef install_ghidra(work):\n    progress(\'java\')\n    if not (JAVA/\'bin/javac\').is_file():\n        run([\'/usr/bin/apt-get\',\'update\',\'-qq\'],root=True,timeout=140)\n        run([\'/usr/bin/apt-get\',\'install\',\'-y\',\'-qq\',\'--no-install-recommends\',\'openjdk-21-jdk-headless\'],root=True,timeout=240)\n    version=run([JAVA/\'bin/javac\',\'-version\']).decode()\n    if not re.match(r\'javac 21\\.\', version): raise RuntimeError(\'Unexpected Java version\')\n    result[\'java\']=\'21\'\n    target=DEST/GHIDRA_NAME\n    if target.exists():\n        if not (target/\'support/analyzeHeadless\').is_file() or not (target/\'Ghidra/application.properties\').is_file():\n            raise RuntimeError(\'The existing Ghidra installation is incomplete\')\n        return\n    progress(\'ghidra_download\')\n    if shutil.disk_usage(DEST).free<2*1024**3:\n        raise RuntimeError(\'Less than 2 GiB available to stage the Ghidra distribution\')\n    archive=work/\'ghidra.zip\'\n    run([\'/usr/bin/curl\',\'--fail\',\'--silent\',\'--show-error\',\'--location\',\'--proto\',\'=https\',\n         \'--retry\',\'2\',\'--connect-timeout\',\'18\',\'--max-time\',\'330\',\'-o\',archive,GHIDRA_URL],timeout=350)\n    if checksum(archive)!=GHIDRA_HASH: raise RuntimeError(\'Ghidra checksum mismatch\')\n    progress(\'ghidra_extract\')\n    with zipfile.ZipFile(archive) as zip_file:\n        for item in zip_file.infolist():\n            p=PurePosixPath(item.filename)\n            m=(item.external_attr>>16)&0xffff\n            if not p.parts or p.parts[0]!=GHIDRA_NAME or \'..\' in p.parts or stat.S_ISLNK(m):\n                raise RuntimeError(\'Unexpected Ghidra archive entry\')\n            dest=Path(zip_file.extract(item,work))\n            if not item.is_dir(): dest.chmod(0o755 if m & 0o111 else 0o644)\n    (work/GHIDRA_NAME).rename(target)\n\n\nasync def probe_mcp(command, cwd):\n    p = await asyncio.create_subprocess_exec(command, cwd=cwd, env=ENV, stdin=asyncio.subprocess.PIPE,\n        stdout=asyncio.subprocess.PIPE,stderr=asyncio.subprocess.DEVNULL,limit=2*1024*1024)\n    async def send(body):\n        p.stdin.write((json.dumps(dict(jsonrpc=\'2.0\',**body))+\'\\n\').encode())\n        await p.stdin.drain()\n    async def receive(id):\n        for _ in range(64):\n            raw=await asyncio.wait_for(p.stdout.readline(),timeout=25)\n            if not raw: raise RuntimeError(\'REA closed its MCP stream\')\n            try: reply=json.loads(raw)\n            except ValueError: continue\n            if reply.get(\'id\')==id and \'result\' in reply: return reply[\'result\']\n            if reply.get(\'id\')==id and \'error\' in reply: raise RuntimeError(\'REA rejected MCP discovery\')\n        raise RuntimeError(\'Did not receive the REA MCP result\')\n    try:\n        await send(dict(id=1,method=\'initialize\',params=dict(protocolVersion=\'2025-03-26\',\n                  capabilities={},clientInfo=dict(name=\'tianqi-install-check\',version=\'1\'))))\n        info=await receive(1)\n        await send(dict(method=\'notifications/initialized\'))\n        await send(dict(id=2,method=\'tools/list\',params={}))\n        tools=(await receive(2))[\'tools\']\n        if not tools or \'tools\' not in info.get(\'capabilities\',{}):\n            raise RuntimeError(\'REA exposed no MCP tools\')\n        return len(tools)\n    finally:\n        p.stdin.close()\n        # The probe performs discovery only. Give the server a chance to close on EOF.\n        try: await asyncio.wait_for(p.wait(),timeout=4)\n        except asyncio.TimeoutError:\n            p.terminate()\n            try: await asyncio.wait_for(p.wait(),timeout=4)\n            except asyncio.TimeoutError: p.kill(); await p.wait()\n\n\ndef install_rea(work):\n    install_ghidra(work)\n    result[\'ghidra\']=\'12.1.4\'\n    progress(\'rea_install\')\n    client=MODULES/\'@deepseek-ai/dsh-mcp-client\'\n    metadata=json.loads((client/\'package.json\').read_text())\n    if metadata.get(\'version\')!=\'0.2.2-rc.3\':\n        raise RuntimeError(\'Missing compatible Harness MCP client\')\n    rea=DEST/f\'rea-{REA}\'\n    if not rea.exists():\n        dest=work/\'rea\'\n        dest.mkdir()\n        atomic(dest/\'package.json\',\'{"name":"tianqi-rea","private":true}\\n\')\n        run([BIN/\'npm\',\'install\',\'--prefix\',dest,\'--no-fund\',\'--no-audit\',\'--ignore-scripts\',\'--save-exact\',\n             \'--registry=https://registry.npmjs.org/\',f\'rea-agents@{REA}\'],timeout=230,cwd=dest)\n        entry=json.loads((dest/\'package-lock.json\').read_text())[\'packages\'][\'node_modules/rea-agents\']\n        if entry.get(\'integrity\')!=\'sha512-KqDn1UR5BMqHoQ3MGAnPuWiSKwgdFaz1L/uUNgrKt+1W8kPtgYP8AWEOXIF1lDIOBVyPuYIIst2iamo1Wf3r8g==\':\n            raise RuntimeError(\'REA package integrity mismatch\')\n        dest.rename(rea)\n    prog=rea/\'node_modules/rea-agents/scripts/rea.mjs\'\n    data=json.loads((prog.parent.parent/\'package.json\').read_text())\n    if data.get(\'version\')!=REA or not prog.is_file(): raise RuntimeError(\'Incorrect REA program\')\n    launcher=\'\'\'#!/bin/sh\nset -eu\nexport JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64\nexport GHIDRA_INSTALL_DIR=/data/apps/tianqi-plugins/ghidra_12.1.4_PUBLIC\nexec /data/apps/deepseek-harness/runtime/bin/node /data/apps/tianqi-plugins/rea-6.9.0/node_modules/rea-agents/scripts/rea.mjs mcp\n\'\'\'\n    if LAUNCHER.exists() and LAUNCHER.read_text()!=launcher:\n        raise RuntimeError(\'A different REA launcher already exists\')\n    temp=work/\'rea-mcp\'\n    atomic(temp,launcher,mode=0o755)\n    progress(\'rea_probe\')\n    results=asyncio.run(probe_mcp(temp,work))\n    result[\'rea_tools\']=results\n    result[\'rea_version\']=REA\n    if not LAUNCHER.exists(): atomic(LAUNCHER,launcher,mode=0o755,replace=False)\n\n\ndef main():\n    assert_role()\n    DEST.mkdir(mode=0o755,exist_ok=True)\n    with (STAGE/\'install.lock\').open(\'w\') as lock:\n        fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\n        with tempfile.TemporaryDirectory(prefix=\'.install-\',dir=DEST) as d:\n            work=Path(d)\n            for p in (STAGE/\'npm-user.ini\',STAGE/\'npm-global.ini\'):\n                if not p.exists(): atomic(p,\'\',replace=False)\n            install_purge(work)\n            install_rea(work)\n        progress(\'complete\')\n\n\nif __name__==\'__main__\':\n    try: main()\n    except Exception as exc:\n        safe=str(exc) if type(exc) is RuntimeError else type(exc).__name__\n        progress(\'failed\', last_phase=phase, error=safe)\n        sys.exit(1)\n'

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None

          def main():
              opener=build_opener(NoRedirect())
              key=os.environ['LI2_API_KEY']
              def req(endpoint,data=None,method=None,size=None):
                  content='application/octet-stream' if method=='PUT' else 'application/json'
                  headers={'X-API-Key':key,'Content-Type':content}
                  if size is not None: headers['Content-Length']=str(size)
                  request=Request(API+endpoint,data=data,method=method,headers=headers)
                  with opener.open(request,timeout=90) as r: return json.load(r)
              ids=[r['id'] for r in req('/v1/machines')['machines'] if r.get('name')=='li2']
              if len(ids)!=1: raise RuntimeError('Unexpected target selection')
              machine='/v1/machines/'+quote(ids[0],safe='')
              def read(path): return req(machine+'/files/content?'+urlencode({'path':path}))
              if read('/data/home/.xin/kernel.env.json').get('XIN_ROLE')!='tianqi':
                  raise RuntimeError('Unexpected target role')
              def put(path,content,size=None):
                  return req(machine+'/files?'+urlencode({'path':path,'mode':'0600','parents':'true'}),content,method='PUT',size=size)
              put(STAGE+'/install-plugins.py',REMOTE.encode())
              command="""import json,os,pathlib,subprocess,sys
          folder=pathlib.Path(sys.argv[1])
          if json.loads(pathlib.Path('/data/home/.xin/kernel.env.json').read_text()).get('XIN_ROLE')!='tianqi':
              raise SystemExit('Unexpected target role')
          status=folder/'progress.json'
          status.unlink(missing_ok=True)
          with open(folder/'install-private.log','w',opener=lambda p,f: os.open(p,f,0o600)) as log:
              subprocess.Popen(['/usr/bin/python3',str(folder/'install-plugins.py')],cwd=folder,
                  env={'PATH':'/usr/local/bin:/usr/bin:/bin','HOME':'/data/home','LANG':'C.UTF-8'},
                  stdin=subprocess.DEVNULL,stdout=log,stderr=log,start_new_session=True)
          print(json.dumps({'installer_started':True}))
          """
              payload={'argv':['/usr/bin/python3','-c',command,STAGE],'timeoutSeconds':25}
              result=req(machine+'/exec',json.dumps(payload).encode(),method='POST')
              if result.get('exitCode')!=0 or not json.loads(result.get('stdout','{}')).get('installer_started'):
                  raise RuntimeError('Did not start the installer')
              last=None
              for _ in range(75):
                  try:
                      state=read(STAGE+'/progress.json')
                  except HTTPError as error:
                      if error.code!=404: raise
                  else:
                      if state!=last: print('TIANQI_INSTALL '+json.dumps(state,sort_keys=True),flush=True)
                      last=state
                      if state.get('phase')=='complete': return
                      if state.get('phase')=='failed': raise RuntimeError('Tianqi plugin installation did not finish')
                  time.sleep(8)
              raise RuntimeError('Tianqi plugin install is still running')

          if __name__=='__main__':
              try: main()
              except HTTPError as error: raise SystemExit('InstaBox returned HTTP '+str(error.code)) from None
              except RuntimeError as error: raise SystemExit(str(error)) from None
          PY
