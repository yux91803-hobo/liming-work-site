name: Tianqi plugin migration
on:
  push:
    branches: [codex/tianqi-li2-account-20261118]
    paths: [.github/workflows/tianqi-li2-account.yml]
permissions: {}
jobs:
  tianqi:
    if: github.repository == 'yux91803-hobo/liming-work-site' && github.ref_name == 'codex/tianqi-li2-account-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Clean the completed plugin installer staging files
        env:
          LI2_API_KEY: ${{ secrets.XIN_TQ_INSTABOX_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import quote
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          API='https://api.instabox.sh'
          REMOTE="import fcntl\nimport json\nimport os\nimport stat\nimport shutil\nfrom pathlib import Path\n\nrole=json.loads(Path('/data/home/.xin/kernel.env.json').read_text()).get('XIN_ROLE')\nif role!='tianqi': raise SystemExit('Unexpected target role')\nstage=Path('/data/tmp/tianqi-plugin-stage')\nif not stage.exists():\n    print(json.dumps({'staging_absent':True,'removed':0}))\n    raise SystemExit(0)\nm=stage.lstat()\nif not stat.S_ISDIR(m.st_mode) or m.st_uid!=os.getuid():\n    raise SystemExit('Unexpected staging ownership')\nrecord=json.loads((stage/'progress.json').read_text())\nif record.get('phase')!='complete' or record.get('purge_version')!='1.6.98' or record.get('rea_version')!='6.9.0':\n    raise SystemExit('Plugin staging is still in use')\nnames=('purge-1.6.98.tgz','install-plugins.py','install-private.log','progress.json','npm-user.ini','npm-global.ini')\nremoved=0\nwith (stage/'install.lock').open('r+') as lock:\n    fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\n    for name in names:\n        path=stage/name\n        try: info=path.lstat()\n        except FileNotFoundError: continue\n        if stat.S_ISREG(info.st_mode) and info.st_uid==os.getuid():\n            path.unlink()\n            removed+=1\n    cache=stage/'npm-cache'\n    if cache.exists():\n        info=cache.lstat()\n        if stat.S_ISDIR(info.st_mode) and info.st_uid==os.getuid():\n            shutil.rmtree(cache)\n            removed+=1\n    (stage/'install.lock').unlink()\n    removed+=1\ntry: stage.rmdir()\nexcept OSError: pass\nprint(json.dumps({'staging_absent':not stage.exists(),'removed':removed},sort_keys=True))\n"
          key=os.environ['LI2_API_KEY']

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None

          def main():
              opener=build_opener(NoRedirect())
              def req(path,body=None):
                  q=Request(API+path,data=json.dumps(body).encode() if body is not None else None,
                            headers={'X-API-Key':key,'Content-Type':'application/json'})
                  with opener.open(q,timeout=115) as r:
                      return json.load(r)
              ids=[r['id'] for r in req('/v1/machines')['machines'] if r.get('name')=='li2']
              if len(ids)!=1: raise RuntimeError('Unexpected target selection')
              run=req('/v1/machines/'+quote(ids[0],safe='')+'/exec',
                      {'argv':['/usr/bin/python3','-c',REMOTE],'timeoutSeconds':105})
              if run.get('exitCode')!=0: raise RuntimeError('Isolated Tianqi verification did not complete')
              proof=json.loads(run['stdout'])
              print('TIANQI_INSTALLER_CLEANUP '+json.dumps(proof,sort_keys=True),flush=True)

          if __name__=='__main__':
              try: main()
              except (ValueError,KeyError,RuntimeError) as error: raise SystemExit(str(error)) from None
          PY
