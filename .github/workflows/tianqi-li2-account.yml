name: Tianqi private account delivery preparation
on:
  push:
    branches: [codex/tianqi-li2-account-20261118]
    paths: [.github/workflows/tianqi-li2-account.yml]
permissions: {}
jobs:
  inspect:
    if: github.repository == 'yux91803-hobo/liming-work-site' && github.ref_name == 'codex/tianqi-li2-account-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare a private one-file upload on li2
        env:
          LI2_API_KEY: ${{ secrets.XIN_TQ_INSTABOX_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import secrets
          import subprocess
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote, urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          API='https://api.instabox.sh'
          BRANCH='codex/tianqi-li2-account-20261118'
          PROBE="import ast\nimport http.client\nimport json\nimport re\nfrom pathlib import Path\n\nbase=Path('/data/workbuddy-gateway/current')\nroot=Path('/data/workbuddy-gateway/accounts')\nrole=json.loads(Path('/data/home/.xin/kernel.env.json').read_text()).get('XIN_ROLE')\nif role!='tianqi':\n    raise SystemExit('Selected machine has an unexpected controller role')\nconnection=http.client.HTTPConnection('127.0.0.1',8788,timeout=6)\nconnection.request('GET','/health')\nresponse=connection.getresponse()\nif response.status!=200:\n    raise SystemExit('The gateway health endpoint is unavailable')\nhealth=json.loads(response.read(256*1024))\nconnection.close()\nsettings=json.loads((root/'settings.json').read_text())\nprograms={name:ast.parse((base/name).read_bytes()) for name in ('wb_proxy.py','wb_accounts.py')}\n\ndef routes(node):\n    return sorted({n.value for n in ast.walk(node) if isinstance(n,ast.Constant) and isinstance(n.value,str)\n                   and re.fullmatch(r'/(?:api|admin|v1)(?:/[A-Za-z0-9_.-]+)+',n.value)\n                   and re.search(r'account|import|setting|login|key|token',n.value)})\n\ndef call_name(c):\n    if isinstance(c.func,ast.Attribute): return c.func.attr\n    if isinstance(c.func,ast.Name): return c.func.id\n\ndef calls(node):\n    return sorted({v for c in ast.walk(node) if isinstance(c,ast.Call) and (v:=call_name(c)) is not None})\n\ndef get_fields(node):\n    allowed={'api_key','panel_password','auth','account','accounts','tokens','access_token','refresh_token','domain','uid','nickname','expires_at','data','json','realm','token','replace','overwrite','mode','dry_run','items','content','payload','filename','imported','success'}\n    return sorted({c.args[0].value for c in ast.walk(node) if isinstance(c,ast.Call) and call_name(c) in {'get','pop','setdefault'}\n                   and c.args and isinstance(c.args[0],ast.Constant) and isinstance(c.args[0].value,str) and c.args[0].value in allowed})\n\nhandlers={}\nfor n in ast.walk(programs['wb_proxy.py']):\n    if isinstance(n,ast.If):\n        for route in routes(n.test):\n            if 'import' in route or route.endswith('/login') or route.endswith('/settings'):\n                body=ast.Module(body=n.body,type_ignores=[])\n                handlers.setdefault(route,[]).append({'calls':calls(body)[:26],'fields':get_fields(body)})\nrefs={x for entries in handlers.values() for e in entries for x in e['calls']}\ninterfaces={}\nfor file,tree in programs.items():\n    for n in ast.walk(tree):\n        if isinstance(n,ast.FunctionDef) and (n.name in refs or re.search(r'import|panel_password|api_key|require_admin|verify_panel',n.name)):\n            if len(interfaces)>=90: break\n            interfaces[n.name]={'file':file,'args':[a.arg for a in n.args.args], 'fields':get_fields(n),'related_calls':[c for c in calls(n) if re.search(r'import|password|auth|realm|account|key|refresh|json|login',c)][:24]}\nprint(json.dumps({'role':role,'accounts':health.get('accounts') if type(health.get('accounts')) is int else None,\n                  'settings_fields':sorted(k for k in settings if re.fullmatch(r'[a-zA-Z_][a-zA-Z_0-9]+',k)),\n                  'panel_password_enabled':bool(settings.get('panel_password')),\n                  'api_routes':routes(programs['wb_proxy.py'])[:60],'handlers':handlers,'interfaces':interfaces},sort_keys=True))\n"
          PUBLIC_KEY='-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAt7UE3qy7WvB4R0/W2IDC\nJrWYC1YRPHJPO4gaPyzR4VuG6oDSNFr3/Y8vxXsbn54O0m5GF3dwnqMMcH1HSs3v\nWFbhul+rqhNaNGPjpf7YsIOMTkcERYgH1reIctYA2MFlY28NTgAdl8UxXblipgoi\nY8SFw4tRKGMrDu7YqRayJo+/8spl2XtcNVBvPw90zGh9zE037HkFkdl3yVpYZXFH\ngcfpsjRpvHmh7RJClFYqHG6W97kwohck48z0GksX4uPHeAWgNIuQ2tkNdxgmFwKn\nKjaypKQuPaJ9tdJIM+Tye14r4//32Ja2CFRC1ybzCPjdCMz4HiOhOSqzrFJhI7H6\nP+dKi3Dh+pLHf418IEgv8KbwVwEWfvJPGi8JdvP9eInf8Z2f8JOvx7e5OsLSgtR+\nzRmVCvuCwN+eH+ixQsEUr5wgk9GU46YMiCvloSd6B0MWqL6Cs6gjTvPUxowfI57P\n4YGbj/Sakx+9749Lkj60Va5mta4L1FBfvl233SkZ7FL3AgMBAAE=\n-----END PUBLIC KEY-----\n'

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None

          def open_client():
              key = os.environ.get('LI2_API_KEY')
              if not key:
                  raise RuntimeError('Tianqi InstaBox authorization missing')
              opener = build_opener(NoRedirect())
              def api(path, payload=None):
                  body = None if payload is None else json.dumps(payload).encode('utf-8')
                  request = Request(API+path,data=body,headers={'X-API-Key':key,'Content-Type':'application/json'})
                  with opener.open(request,timeout=65) as response:
                      return json.load(response)
              return api

          def machine(api):
              rows=[r for r in api('/v1/machines')['machines'] if r.get('name')=='li2']
              if len(rows)!=1 or not rows[0].get('id'):
                  raise RuntimeError('Tianqi key did not resolve to a unique li2')
              return '/v1/machines/'+quote(rows[0]['id'],safe='')

          ENVELOPE=r"""const c=require('node:crypto'),fs=require('node:fs');
          const i=JSON.parse(fs.readFileSync(0,'utf8'));
          const key=c.randomBytes(32),iv=c.randomBytes(12),cipher=c.createCipheriv('aes-256-gcm',key,iv);
          cipher.setAAD(Buffer.from('liming-tianqi-account-upload-v1'));
          const data=Buffer.concat([cipher.update(JSON.stringify(i.metadata),'utf8'),cipher.final()]);
          const encode=x=>x.toString('base64');
          const wrapped=c.publicEncrypt({key:i.publicKey,padding:c.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key);
          console.log(JSON.stringify({wrapped:encode(wrapped),nonce:encode(iv),tag:encode(cipher.getAuthTag()),data:encode(data)}));"""

          def main():
              api=open_client()
              target=machine(api)
              probe=api(target+'/exec',{'argv':['/usr/bin/python3','-c',PROBE],'timeoutSeconds':35})
              if probe.get('exitCode')!=0:
                  raise RuntimeError('The li2 gateway metadata check failed')
              report=json.loads(probe['stdout'])
              if report.get('role')!='tianqi':
                  raise RuntimeError('Unexpected target role')
              print('TIANQI_GATEWAY_INTERFACE '+json.dumps(report),flush=True)
              run_id=str(int(os.environ['GITHUB_RUN_ID']))
              slot='/data/tmp/liming-tq-account/'+run_id+'-'+secrets.token_hex(12)+'/accounts.json'
              grant=api(target+'/files/upload-url',{'path':slot,'mode':'0600','parents':True,'expiresInSeconds':900})
              url=urlsplit(grant['url'])
              if url.scheme!='https' or url.netloc!='api.instabox.sh' or grant['method']!='PUT' or grant['path']!=slot:
                  raise RuntimeError('Provider returned an unexpected upload destination')
              envelope=subprocess.run(['node','-e',ENVELOPE], input=json.dumps({'publicKey':PUBLIC_KEY,'metadata':grant}),
                                      text=True,capture_output=True,check=True,env={'PATH':os.environ['PATH']},timeout=12)
              print('TIANQI_UPLOAD_ENVELOPE '+envelope.stdout.strip(),flush=True)

          if __name__=='__main__':
              try:
                  main()
              except HTTPError as error:
                  raise SystemExit('InstaBox response HTTP '+str(error.code)) from None
              except (URLError,TimeoutError,ValueError,KeyError,TypeError,subprocess.SubprocessError):
                  raise SystemExit('Private delivery setup did not finish') from None
          PY
