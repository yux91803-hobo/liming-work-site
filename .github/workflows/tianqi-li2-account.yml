name: Tianqi plugin migration
on:
  push:
    branches: [codex/tianqi-li2-account-20261118]
    paths: [.github/workflows/tianqi-li2-account.yml]
permissions: {}
jobs:
  tianqi:
    if: github.repository == 'yux91803-hobo/liming-work-site' && github.ref_name == 'codex/tianqi-li2-account-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check the existing gateway model route and error category
        env:
          LI2_API_KEY: ${{ secrets.XIN_TQ_INSTABOX_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import quote
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          API='https://api.instabox.sh'
          REMOTE="import http.client\nimport json\nimport re\nimport subprocess\nfrom pathlib import Path\n\nroot=Path('/data/home/.xin')\nif json.loads((root/'kernel.env.json').read_text()).get('XIN_ROLE')!='tianqi':\n    raise SystemExit('Unexpected target role')\nkey=(root/'harness.key').read_text().strip()\nknown={'deepseek-v4.1-flash','glm-5.3','glm-5.3-flash'}\npatterns={\n  'upstream_transport':r'upstream|upstream_error|network|connection|connect',\n  'region':r'region|country|location|unsupported geo',\n  'credentials':r'credential|unauthori[sz]ed|expired|session|refresh|invalid token|not logged in',\n  'accounts':r'no account|available account|accounts? (unavailable|invalid|failed|exhausted)|no usable account',\n  'quota':r'quota|exhausted|rate limit|resource exhausted|insufficient balance',\n  'route':r'not supported|unknown model|unavailable model|no model|not found',\n  'tool_schema':r'tool(s|_choice| call).*(large|limit|max|unexpected|invalid)|schema.*(invalid|unsupported)',\n  'timeout':r'timed out|timeout|deadline',\n  'gateway_client_auth':r'api key|bearer token',\n}\n\ndef request(path,payload=None):\n    con=http.client.HTTPConnection('127.0.0.1',8788,timeout=65)\n    try:\n        data=json.dumps(payload).encode() if payload is not None else None\n        con.request('POST' if data else 'GET',path,body=data,\n                    headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})\n        res=con.getresponse()\n        body=res.read(1024*1024)\n        try: doc=json.loads(body)\n        except ValueError: doc={}\n        return res.status,doc\n    finally: con.close()\n\ndef describe(status,doc):\n    error=doc.get('error',{})\n    error=error if isinstance(error,dict) else {}\n    msg=str(error.get('message',doc.get('message','')))[:2500].lower()\n    fields={k:v for k in ('type','code') if isinstance((v:=error.get(k)),(str,int))\n             and re.fullmatch(r'[A-Za-z_0-9.-]{1,80}',str(v))}\n    return {'http':status,'error_fields':fields,'categories':sorted(k for k,v in patterns.items() if re.search(v,msg)),\n            'http_in_error':sorted(set(re.findall(r'(?<![0-9])(?:401|403|404|429|500|502|503|504)(?![0-9])',msg))),\n            'response': status==200 and bool(doc.get('output') or doc.get('choices'))}\n\ncode,models=request('/v1/models')\nfound=[m['id'] for m in models.get('data',[]) if m.get('id') in known]\npayload={'model':'deepseek-v4.1-flash','input':'只回复一个字：好','stream':False,'max_output_tokens':32}\nresult={'models_http':code,'tianqi_models':found,'models_count':len(models.get('data',[]))}\nif 'deepseek-v4.1-flash' in found:\n    try: result['responses']=describe(*request('/v1/responses',payload))\n    except (OSError,http.client.HTTPException): result['responses']={'transport_timeout':True}\nrun=subprocess.run(['journalctl','-u','workbuddy-gateway.service','--since','15 minutes ago','-n','100','-o','cat','--no-pager'],\n                   stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=8)\nlog=run.stdout.decode(errors='replace').lower()\nresult['service_log_categories']={k:len(re.findall(v,log)) for k,v in patterns.items() if re.search(v,log)}\nresult['service_logs_readable']=run.returncode==0\nprint(json.dumps(result,sort_keys=True))\n"
          key=os.environ['LI2_API_KEY']

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None

          def main():
              opener=build_opener(NoRedirect())
              def req(path,body=None):
                  q=Request(API+path,data=json.dumps(body).encode() if body is not None else None,
                            headers={'X-API-Key':key,'Content-Type':'application/json'})
                  with opener.open(q,timeout=115) as r:
                      return json.load(r)
              ids=[r['id'] for r in req('/v1/machines')['machines'] if r.get('name')=='li2']
              if len(ids)!=1: raise RuntimeError('Unexpected target selection')
              run=req('/v1/machines/'+quote(ids[0],safe='')+'/exec',
                      {'argv':['/usr/bin/python3','-c',REMOTE],'timeoutSeconds':105})
              if run.get('exitCode')!=0: raise RuntimeError('Isolated Tianqi verification did not complete')
              proof=json.loads(run['stdout'])
              print('TIANQI_GATEWAY_STATE '+json.dumps(proof,sort_keys=True),flush=True)

          if __name__=='__main__':
              try: main()
              except (ValueError,KeyError,RuntimeError) as error: raise SystemExit(str(error)) from None
          PY
