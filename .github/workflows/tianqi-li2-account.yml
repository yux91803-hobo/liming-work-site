name: Tianqi plugin migration
on:
  push:
    branches: [codex/tianqi-li2-account-20261118]
    paths: [.github/workflows/tianqi-li2-account.yml]
permissions: {}
jobs:
  tianqi:
    if: github.repository == 'yux91803-hobo/liming-work-site' && github.ref_name == 'codex/tianqi-li2-account-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check the published layout, both plugins and a disposable Tianqi reply
        env:
          XIN_OWNER_PASSWORD: ${{ secrets.XIN_OWNER_PASSWORD }}
        run: |
          python3 - <<'PY'
          import http.cookiejar
          import json
          import os
          import re
          import sys
          import time
          import uuid
          from urllib.error import HTTPError
          from urllib.request import HTTPCookieProcessor, HTTPRedirectHandler, Request, build_opener

          BASE='https://liming-work.com'
          PASSWORD=os.environ['XIN_OWNER_PASSWORD']

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          OPENER=build_opener(NoRedirect(),HTTPCookieProcessor(http.cookiejar.CookieJar()))

          def request(path, payload=None):
              if not path.startswith('/') or path.startswith('//'): raise ValueError('Unexpected site path')
              data=None if payload is None else json.dumps(payload).encode('utf-8')
              req=Request(BASE+path,data=data,headers={'Content-Type':'application/json','X-Xin':'1',
                                                      'Origin':BASE,'User-Agent':'Tianqi-release-check'})
              try:
                  with OPENER.open(req,timeout=55) as response:
                      return response.status,response.read(2*1024*1024)
              except HTTPError as failure:
                  return failure.code,failure.read(512*1024)

          def get(path, body=None):
              status,response=request(path,body)
              try: content=json.loads(response)
              except ValueError: content={}
              return status,content

          def call(op,args=None):
              status,body=get('/api/tq/call',{'op':op,'args':args or {}})
              return status,body,body.get('data') or {}

          def wait_read(op,args=None,until=None,timeout=120):
              limit=time.monotonic()+timeout
              while time.monotonic()<limit:
                  status,r,d=call(op,args)
                  if status==200 and r.get('ok') and (until is None or until(d)): return d
                  if op=='plugins' and d.get('error') in {'not_in_tianqi','bad_op'}:
                      time.sleep(3)
                      continue
                  if status in (400,401,403,404) or d.get('error'):
                      raise RuntimeError(f'{op} rejected with HTTP {status}')
                  time.sleep(2)
              raise RuntimeError(f'{op} did not finish')

          def main():
              status,body=request('/tools/tianqi/')
              marker=b'<template id="tianqi-workbench">'
              if status!=200 or marker not in body:
                  raise RuntimeError('The new Tianqi template is not deployed')
              status,css=request('/tools/tianqi/workbench.css')
              if status!=200 or b'.tq-desk' not in css or b'.tq-star-key' not in css:
                  raise RuntimeError('The new Tianqi workbench styles are missing')
              status,_=get('/api/tq/login',{'password':PASSWORD})
              if status!=200: raise RuntimeError('Tianqi login did not complete')
              _,me=get('/api/tq/me')
              if not (me.get('enabled') and me.get('authed')): raise RuntimeError('Tianqi login state not confirmed')
              ready=wait_read('ping',until=lambda d:d.get('role')=='tianqi' and d.get('ready'))
              plugins=wait_read('plugins',{'agent':'harness'})
              instances={p.get('name'):p.get('on') for p in plugins.get('plugins',[])}
              if set(instances)!={'purge','rea'}: raise RuntimeError('The Tianqi plugin list differs')
              print('TIANQI_SITE '+json.dumps({'layout':True,'li2_ready':bool(ready),'plugins':instances},sort_keys=True),flush=True)

              sid=run=''
              fixture={'agent':'harness','model':'deepseek-v4.1-flash','effort':'off','clientId':uuid.uuid4().hex,
                       'text':'只回复一个字：好'}
              result={'real_reply':False,'cleaned_fixture':False}
              try:
                  status,accept,d=call('send',fixture)
                  if status!=200: raise RuntimeError('The Tianqi fixture was not accepted')
                  if accept.get('accepted') and accept.get('delivery',{}).get('id'):
                      job=wait_read('delivery',{'id':accept['delivery']['id']},until=lambda d:d.get('state') in {'delivered','failed'},timeout=100)
                      d=job.get('result') or {}
                  sid,run=d.get('sid',''),d.get('run','')
                  if not re.fullmatch(r's[a-z0-9]{6,24}',sid) or not re.fullmatch(r'r[a-z0-9]{6,24}',run):
                      raise RuntimeError('The Tianqi fixture session or run was not created')
                  deadline=time.monotonic()+110
                  off=0
                  while time.monotonic()<deadline:
                      _,accept,poll=call('poll',{'run':run,'off':off})
                      if accept.get('ok'):
                          off=poll.get('off',off)
                          for event in poll.get('events',[]):
                              if event.get('t')=='text' and event.get('text','').strip(): result['real_reply']=True
                              if event.get('t')=='done': result['run_completed']=bool(event.get('ok'))
                          if poll.get('done'): break
                      time.sleep(2)
                  if not result.get('real_reply') or not result.get('run_completed'):
                      raise RuntimeError('The Tianqi fixture did not complete a real reply')
              finally:
                  if sid and run:
                      if not result.get('run_completed'): call('stop',{'run':run,'sid':sid})
                      for _ in range(12):
                          _,r,d=call('forget',{'sid':sid})
                          if r.get('ok') and not d.get('error'):
                              result['cleaned_fixture']=True
                              break
                          time.sleep(2)
                  print('TIANQI_SITE_REPLY '+json.dumps(result,sort_keys=True),flush=True)
                  if sid and not result['cleaned_fixture']: raise RuntimeError('The local reference to the fixture needs cleanup')

          if __name__=='__main__':
              try: main()
              except (RuntimeError,ValueError,TimeoutError,OSError) as error:
                  raise SystemExit(str(error) if isinstance(error,RuntimeError) else 'Tianqi live check could not finish') from None
          PY
