name: Tianqi gateway native import verification
on:
  push:
    branches: [codex/tianqi-li2-account-20261118]
    paths: [.github/workflows/tianqi-li2-account.yml]
permissions: {}
jobs:
  inspect:
    if: github.repository == 'yux91803-hobo/liming-work-site' && github.ref_name == 'codex/tianqi-li2-account-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check gateway import route and authentication shape
        env:
          LI2_API_KEY: ${{ secrets.XIN_TQ_INSTABOX_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import secrets
          import subprocess
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote, urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          API='https://api.instabox.sh'
          BRANCH='codex/tianqi-li2-account-20261118'
          PROBE='import ast\nimport http.client\nimport json\nimport re\nfrom pathlib import Path\n\nbase=Path(\'/data/workbuddy-gateway/current\')\nproxy=(base/\'wb_proxy.py\').read_text()\naccounts=(base/\'wb_accounts.py\').read_text()\nhtml=(base/\'dashboard.html\').read_text()\nroot=ast.parse(proxy)\n\nhandlers={}\nfor f in ast.walk(root):\n    if isinstance(f,ast.FunctionDef) and f.name in {\'_route_accounts_import\',\'_coerce_account_rows\'}:\n        handlers[f.name]=ast.get_source_segment(proxy,f)\nfor f in ast.walk(ast.parse(accounts)):\n    if isinstance(f,ast.FunctionDef) and f.name==\'normalise_import_row\':\n        handlers[f.name]=ast.get_source_segment(accounts,f)\n\nrefs=[]\nfor n,line in enumerate(proxy.splitlines(),1):\n    if re.search(r\'_route_accounts_import\\b|PANEL_(?:API|ALIAS|ROUTES|PREFIX)|\\bWB_PROXY_API_KEY\\b\',line):\n        if len(line)<220 and not re.search(r\'eyJ[A-Za-z0-9_\\-]{15,}\\.|\\bsk-[A-Za-z0-9_\\-]{15,}\',line):\n            refs.append([n,line.strip()])\npaths=sorted(set(re.findall(r"[\\"\'](/[A-Za-z0-9_.-/]*(?:accounts|account)/import(?:-preview)?)[\\"\']",html+proxy)))\n\nctx=http.client.HTTPConnection(\'127.0.0.1\',8788,timeout=8)\ndef status(path,headers=None):\n    ctx.request(\'GET\',path,headers=headers or {})\n    r=ctx.getresponse()\n    r.read(1024*1024)\n    return r.status\ntry:\n    models_without_auth=status(\'/v1/models\')\n    models_with_placeholder=status(\'/v1/models\',{\'Authorization\':\'Bearer tianqi-local-probe-only\'})\nfinally:\n    ctx.close()\n\nsafe=[]\nfor f in ast.walk(root):\n    if isinstance(f,ast.Call) and f.args and getattr(f.func,\'attr\',\'\')==\'add_argument\' and isinstance(f.args[0],ast.Constant) and f.args[0].value in {\'--api-key\',\'--panel-password\'}:\n        names={n.value for n in ast.walk(f) if isinstance(n,ast.Constant) and isinstance(n.value,str) and re.fullmatch(r\'[A-Z][A-Z0-9_]{3,50}\',n.value)}\n        safe.append({\'argument\':f.args[0].value,\'environment_names\':sorted(names)})\n# These program handlers describe the JSON schema. Refuse any long token-like literal before returning snippets.\nif any(re.search(r\'eyJ[A-Za-z0-9_\\-]{15,}\\.|\\b(?:sk-|ibk_)[A-Za-z0-9_\\-]{15,}|PRIVATE KEY-----\',src) for src in handlers.values()):\n    raise SystemExit(\'Unexpected credential-like literal in gateway program\')\nprint(json.dumps({\'refs\':refs[:26],\'paths\':paths,\'handlers\':handlers,\'model_statuses\':[models_without_auth,models_with_placeholder],\'launch_args\':safe},sort_keys=True))\n'

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None

          def open_client():
              key = os.environ.get('LI2_API_KEY')
              if not key:
                  raise RuntimeError('Tianqi InstaBox authorization missing')
              opener = build_opener(NoRedirect())
              def api(path, payload=None):
                  body = None if payload is None else json.dumps(payload).encode('utf-8')
                  request = Request(API+path,data=body,headers={'X-API-Key':key,'Content-Type':'application/json'})
                  with opener.open(request,timeout=65) as response:
                      return json.load(response)
              return api

          def machine(api):
              rows=[r for r in api('/v1/machines')['machines'] if r.get('name')=='li2']
              if len(rows)!=1 or not rows[0].get('id'):
                  raise RuntimeError('Tianqi key did not resolve to a unique li2')
              return '/v1/machines/'+quote(rows[0]['id'],safe='')


          if __name__=='__main__':
              try:
                  api=open_client()
                  result=api(machine(api)+'/exec',{'argv':['/usr/bin/python3','-c',PROBE],'timeoutSeconds':32})
                  if result.get('exitCode')!=0: raise SystemExit('Gateway route probe did not finish')
                  print('TIANQI_IMPORT_ROUTE '+json.dumps(json.loads(result['stdout']),sort_keys=True))
              except HTTPError as error:
                  raise SystemExit('InstaBox response HTTP '+str(error.code)) from None
              except (URLError,TimeoutError,ValueError,KeyError,TypeError):
                  raise SystemExit('Gateway route probe did not return a usable report') from None
          PY
