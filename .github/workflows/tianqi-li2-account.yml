name: Tianqi gateway route binding verification
on:
  push:
    branches: [codex/tianqi-li2-account-20261118]
    paths: [.github/workflows/tianqi-li2-account.yml]
permissions: {}
jobs:
  inspect:
    if: github.repository == 'yux91803-hobo/liming-work-site' && github.ref_name == 'codex/tianqi-li2-account-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check gateway import route and authentication shape
        env:
          LI2_API_KEY: ${{ secrets.XIN_TQ_INSTABOX_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import secrets
          import subprocess
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote, urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          API='https://api.instabox.sh'
          BRANCH='codex/tianqi-li2-account-20261118'
          PROBE='import ast\nimport json\nimport re\nfrom pathlib import Path\n\nsource=Path(\'/data/workbuddy-gateway/current/wb_proxy.py\').read_text()\nhtml=Path(\'/data/workbuddy-gateway/current/dashboard.html\').read_text()\ntree=ast.parse(source)\nrows=source.splitlines()\nhandlers={}\nattributes={getattr(c.func,\'attr\',\'\') for c in ast.walk(tree) if isinstance(c,ast.Call)}\ninteresting={\'_route_accounts_import\'}\nfor stage in range(2):\n    upstream=set()\n    for f in ast.walk(tree):\n        if not isinstance(f,ast.FunctionDef) or f.name in interesting:\n            continue\n        for node in ast.walk(f):\n            if isinstance(node,ast.Call) and getattr(node.func,\'attr\',\'\') in interesting:\n                lo=max(f.lineno-1,node.lineno-8); hi=min(f.end_lineno,node.lineno+5)\n                fragment=\'\\n\'.join(rows[lo:hi])\n                if re.search(r\'eyJ[A-Za-z0-9_-]{15,}\\.|\\b(?:sk-|ibk_)[A-Za-z0-9_-]{15,}\',fragment):\n                    continue\n                handlers[f.name]=fragment\n                upstream.add(f.name)\n    interesting|=upstream\nprefixes=sorted({value.value for value in ast.walk(tree) if isinstance(value,ast.Constant) and isinstance(value.value,str) and re.fullmatch(r\'/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*\',value.value) and re.search(r\'panel|accounts/import|dashboard\',value.value)})\njs=sorted(set(re.findall(r\'\'\'["\'`](/[A-Za-z0-9_.-/]*(?:panel|account|dashboard)[A-Za-z0-9_.-/]*)["\'`]\'\'\',html)))\nprint(json.dumps({\'dispatch\':handlers,\'prefixes\':prefixes[:45],\'js_paths\':js[:45]},sort_keys=True))\n'

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None

          def open_client():
              key = os.environ.get('LI2_API_KEY')
              if not key:
                  raise RuntimeError('Tianqi InstaBox authorization missing')
              opener = build_opener(NoRedirect())
              def api(path, payload=None):
                  body = None if payload is None else json.dumps(payload).encode('utf-8')
                  request = Request(API+path,data=body,headers={'X-API-Key':key,'Content-Type':'application/json'})
                  with opener.open(request,timeout=65) as response:
                      return json.load(response)
              return api

          def machine(api):
              rows=[r for r in api('/v1/machines')['machines'] if r.get('name')=='li2']
              if len(rows)!=1 or not rows[0].get('id'):
                  raise RuntimeError('Tianqi key did not resolve to a unique li2')
              return '/v1/machines/'+quote(rows[0]['id'],safe='')


          if __name__=='__main__':
              try:
                  api=open_client()
                  result=api(machine(api)+'/exec',{'argv':['/usr/bin/python3','-c',PROBE],'timeoutSeconds':32})
                  if result.get('exitCode')!=0: raise SystemExit('Gateway route probe did not finish')
                  print('TIANQI_IMPORT_DISPATCH '+json.dumps(json.loads(result['stdout']),sort_keys=True))
              except HTTPError as error:
                  raise SystemExit('InstaBox response HTTP '+str(error.code)) from None
              except (URLError,TimeoutError,ValueError,KeyError,TypeError):
                  raise SystemExit('Gateway route probe did not return a usable report') from None
          PY
