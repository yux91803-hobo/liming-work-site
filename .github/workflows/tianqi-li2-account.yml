name: Tianqi plugin migration
on:
  push:
    branches: [codex/tianqi-li2-account-20261118]
    paths: [.github/workflows/tianqi-li2-account.yml]
permissions: {}
jobs:
  tianqi:
    if: github.repository == 'yux91803-hobo/liming-work-site' && github.ref_name == 'codex/tianqi-li2-account-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Verify the exact versions and stage the Purge program
        env:
          LI2_API_KEY: ${{ secrets.XIN_TQ_INSTABOX_API_KEY }}
          LI_API_KEY: ${{ secrets.XIN_INSTABOX_API_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib
          import http.client
          import io
          import json
          import os
          import re
          import tarfile
          import tomllib
          from pathlib import PurePosixPath
          from urllib.error import HTTPError
          from urllib.parse import quote, urlencode
          from urllib.request import HTTPRedirectHandler, Request, build_opener


          API = 'https://api.instabox.sh'
          ARCHIVE = '/data/home/.dsh/dsh-purge-community/pkgs/c26291aca10290fbf62d4e03dbf111cbfeb1e19976dac4e8c97501c765d90b46/dsh-purge-community-1.6.98.tgz'
          REA = '/data/home/.local/lib/node_modules/rea-agents'
          TARGET = '/data/tmp/tianqi-plugin-stage/purge-1.6.98.tgz'


          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None


          class InstaBox:
              def __init__(self, secret):
                  self.key = os.environ[secret]
                  self.opener = build_opener(NoRedirect())

              def request(self, endpoint, *, data=None, method=None, limit=1024*1024):
                  request = Request(API+endpoint, data=data, method=method, headers={
                      'X-API-Key': self.key, 'Content-Type': 'application/octet-stream' if method=='PUT' else 'application/json'
                  })
                  with self.opener.open(request,timeout=75) as response:
                      raw = response.read(limit+1)
                  if len(raw)>limit:
                      raise ValueError('Unexpected file size')
                  return raw

              def select(self, name):
                  ids=[r['id'] for r in json.loads(self.request('/v1/machines'))['machines'] if r.get('name')==name]
                  if len(ids)!=1: raise ValueError('Unexpected machine selection')
                  return '/v1/machines/'+quote(ids[0],safe='')

              def read(self, machine, path, limit):
                  return self.request(machine+'/files/content?'+urlencode({'path':path}),limit=limit)

              def list(self,machine,path):
                  return json.loads(self.request(machine+'/files?'+urlencode({'path':path})))


          def toolchain_path(raw, label):
              if not re.fullmatch(r'/(?:data|opt|usr|home)/[A-Za-z0-9_.@/+\-]+',raw or '') or '..' in raw.split('/'):
                  raise ValueError('Unexpected '+label+' program location')
              return raw


          def main():
              source,target=InstaBox('LI_API_KEY'),InstaBox('LI2_API_KEY')
              li,li2=source.select('li'),target.select('li2')
              if li==li2: raise ValueError('Source and target must be distinct')
              role=json.loads(target.read(li2,'/data/home/.xin/kernel.env.json',32768)).get('XIN_ROLE')
              if role!='tianqi': raise ValueError('Unexpected target role')
              raw=source.read(li,ARCHIVE,3*1024*1024)
              digest=hashlib.sha256(raw).hexdigest()
              if digest!=ARCHIVE.split('/')[-2]: raise ValueError('Purge archive checksum mismatch')
              with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
                  for member in tf:
                      p=PurePosixPath(member.name)
                      if not p.parts or p.parts[0]!='package' or '..' in p.parts or not (member.isfile() or member.isdir()):
                          raise ValueError('Unexpected Purge package contents')
                  package=json.load(tf.extractfile('package/package.json'))
              if package.get('name')!='dsh-purge-community' or package.get('version')!='1.6.98':
                  raise ValueError('Purge package does not match the selected version')
              target.request(li2+'/files?'+urlencode({'path':TARGET,'mode':'0600','parents':'true'}),data=raw,method='PUT')
              if hashlib.sha256(target.read(li2,TARGET,len(raw))).hexdigest()!=digest:
                  raise ValueError('Target archive checksum mismatch')
              print('PURGE_STAGED '+json.dumps({'version':package['version'],'dependencies':sorted(package.get('dependencies',{})),
                   'peer_dependencies':sorted(package.get('peerDependencies',{})),'sha256':digest}),flush=True)
              metadata=json.loads(source.read(li,REA+'/package.json',64*1024))
              if metadata.get('name')!='rea-agents' or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[a-z0-9.-]+)?',metadata.get('version','')):
                  raise ValueError('Unexpected REA program metadata')
              config=tomllib.loads(source.read(li,'/data/home/.codex/config.toml',128*1024).decode())
              entry=config['mcp_servers']['rea']
              env=entry.get('env',{})
              ghidra=toolchain_path(env.get('GHIDRA_INSTALL_DIR'),'Ghidra')
              java=toolchain_path(env.get('JAVA_HOME'),'Java')
              disabled_scripts=metadata.get('scripts',{})
              print('REA_SOURCE '+json.dumps({'version':metadata['version'],'mcp_subcommand':entry.get('args')==['mcp'],
                    'mcp_serve_subcommand':entry.get('args')==['serve'],
                    'ghidra':ghidra,'java':java,'startup':entry.get('startup_timeout_sec'),
                    'tool':entry.get('tool_timeout_sec'),'has_postinstall':bool(disabled_scripts.get('postinstall')),
                    'ghidra_files':[r['name'] for r in source.list(li,ghidra).get('entries',[])
                                   if r.get('name') in {'Ghidra','JDK','support','Extensions','ghidraRun'}]}),flush=True)
              print('TARGET_PROGRAMS '+json.dumps({p:target.list(li2,p).get('type') for p in ['/data/apps','/usr/lib/jvm']}),flush=True)


          if __name__=='__main__':
              try: main()
              except HTTPError as error: raise SystemExit('InstaBox returned HTTP '+str(error.code)) from None
              except (ValueError,KeyError,TypeError,OSError) as error:
                  raise SystemExit('Plugin preflight failed: '+type(error).__name__) from None
          PY
