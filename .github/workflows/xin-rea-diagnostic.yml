name: Diagnose Tianqi REA
on:
  push:
    branches: [codex/xin-rea-diagnostic-20261120]
    paths: [.github/workflows/xin-rea-diagnostic.yml]
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reproduce REA startup in an isolated workspace and session store
        env:
          LI2_API_KEY: ${{ secrets.XIN_TQ_INSTABOX_API_KEY }}
        run: |
          python3 - <<'PY_DIAG'
          import json,os,re,hashlib
          from urllib.parse import quote,urlencode
          from urllib.request import Request,build_opener,HTTPRedirectHandler
          from urllib.error import HTTPError
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args): return None
          opener=build_opener(NoRedirect())
          base='https://api.instabox.sh/v1/machines'
          headers={'X-API-Key':os.environ['LI2_API_KEY'],'User-Agent':'Tianqi-rea-diagnostic'}
          def read(url,limit=2097152):
              with opener.open(Request(url,headers=headers),timeout=30) as r: b=r.read(limit+1)
              if len(b)>limit: raise ValueError('Read bound exceeded')
              return b
          
          try:
              machines=json.loads(read(base))['machines']
              matches=[m for m in machines if m.get('name')=='li2']
              if len(matches)!=1 or matches[0].get('state')!='running': raise ValueError('Expected running li2')
              url=base+'/'+quote(matches[0]['id'],safe='')+'/exec'
              payload={'argv':['python3','-c',"import json,os,select,subprocess,time\nbridge=\"\\nconst normalize = function reaInputSchema(schema) {\\n  if (!schema || typeof schema !== 'object' || Array.isArray(schema)) return schema;\\n  const out = { ...schema };\\n  if (Array.isArray(out.allOf) && out.allOf.length && out.allOf.every(x => x && typeof x.pattern === 'string' && Object.keys(x).length === 1)) delete out.allOf;\\n  for (const key of ['properties', 'patternProperties', '$defs', 'definitions', 'dependentSchemas']) {\\n    if (out[key] && typeof out[key] === 'object' && !Array.isArray(out[key])) out[key] = Object.fromEntries(Object.entries(out[key]).map(([name, value]) => [name, reaInputSchema(value)]));\\n  }\\n  for (const key of ['items', 'additionalProperties', 'unevaluatedProperties', 'contains', 'propertyNames', 'not', 'if', 'then', 'else']) {\\n    if (out[key] && typeof out[key] === 'object') out[key] = Array.isArray(out[key]) ? out[key].map(reaInputSchema) : reaInputSchema(out[key]);\\n  }\\n  for (const key of ['allOf', 'anyOf', 'oneOf', 'prefixItems']) if (Array.isArray(out[key])) out[key] = out[key].map(reaInputSchema);\\n  return out;\\n};\\nconst {spawn} = require('node:child_process'), {createInterface} = require('node:readline');\\nconst child = spawn(process.argv[1], [], {stdio:['pipe','pipe','inherit']}), lists = new Set();\\nlet ended = false, timer;\\nconst input = createInterface({input:process.stdin}), output = createInterface({input:child.stdout});\\ninput.on('line', line => {\\n  try { const m=JSON.parse(line); if(m.method==='tools/list' && m.id!=null) lists.add(m.id); } catch {}\\n  if(!child.stdin.destroyed) child.stdin.write(line+'\\\\n');\\n});\\noutput.on('line', line => {\\n  try {\\n    const m=JSON.parse(line);\\n    if(!m.method && lists.delete(m.id) && Array.isArray(m.result?.tools)) {\\n      m.result.tools=m.result.tools.map(t=>({...t,inputSchema:normalize(t.inputSchema)}));\\n      line=JSON.stringify(m);\\n    }\\n  } catch {}\\n  process.stdout.write(line+'\\\\n');\\n});\\ninput.on('close', () => {\\n  if(ended) return;\\n  child.stdin.end(); timer=setTimeout(()=>child.kill('SIGKILL'),1500);timer.unref();\\n});\\nchild.stdin.on('error',()=>{});\\nchild.on('error',()=>{process.stderr.write('REA MCP 启动失败\\\\n');process.exitCode=1;input.close();process.stdin.destroy();});\\nchild.on('close',code=>{ended=true;clearTimeout(timer);input.close();process.stdin.destroy();process.exitCode=Number.isInteger(code)?code:1;});\\nfor(const signal of ['SIGTERM','SIGINT']) process.on(signal,()=>{child.kill(signal);clearTimeout(timer);timer=setTimeout(()=>child.kill('SIGKILL'),1000);timer.unref();});\\n\"\nchild=subprocess.Popen(['/data/apps/deepseek-harness/runtime/bin/node','-e',bridge,'/data/home/.local/bin/tianqi-rea-mcp'],cwd='/data/tmp',stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True)\ndef send(message):\n    child.stdin.write(json.dumps({'jsonrpc':'2.0',**message})+'\\n');child.stdin.flush()\ndef receive(id):\n    until=time.monotonic()+25\n    while time.monotonic()<until:\n        if not select.select([child.stdout],[],[],max(0,until-time.monotonic()))[0]:break\n        line=child.stdout.readline()\n        if not line:break\n        reply=json.loads(line)\n        if reply.get('id')==id:return reply\n    raise RuntimeError('MCP response deadline')\ntry:\n    send({'id':1,'method':'initialize','params':{'protocolVersion':'2025-03-26','capabilities':{},'clientInfo':{'name':'tianqi-rea-check','version':'1'}}})\n    if 'result' not in receive(1):raise RuntimeError('Initialize failed')\n    send({'method':'notifications/initialized'})\n    send({'id':2,'method':'tools/list','params':{}})\n    tools=receive(2).get('result',{}).get('tools',[])\n    target=next(t for t in tools if t.get('name')=='binary_session')\n    if 'allOf' in target['inputSchema']['properties']['expected_server_path']:raise RuntimeError('Schema was not normalized')\n    send({'id':3,'method':'tools/call','params':{'name':'binary_session','arguments':{}}})\n    valid=receive(3)\n    if 'error' in valid or valid.get('result',{}).get('isError'):raise RuntimeError('Valid query was rejected')\n    send({'id':4,'method':'tools/call','params':{'name':'binary_session','arguments':{'expected_server_path':'relative'}}})\n    invalid=receive(4)\n    rejected='error' in invalid or invalid.get('result',{}).get('isError') is True\n    if not rejected or 'expected_server_path' not in json.dumps(invalid):raise RuntimeError('Original parameter validation was not enforced')\n    child.stdin.close();child.wait(timeout=4)\n    if child.returncode!=0:raise RuntimeError('Bridge did not close cleanly')\n    print('REA_MCP_REAL '+json.dumps({'tools':len(tools),'valid_query':True,'invalid_path_rejected':True,'bridge_exit':0}),flush=True)\nfinally:\n    if child.poll() is None:child.kill();child.wait()\n"],'timeoutSeconds':100,'noHistory':True}
              with opener.open(Request(url,headers={**headers,'Content-Type':'application/json'},data=json.dumps(payload).encode()),timeout=115) as r: result=json.load(r)
              for line in result.get('stdout','').splitlines():
                  if line.startswith('REA_MCP_REAL '):print(line,flush=True)
              if result.get('exitCode',result.get('exit_code'))!=0:raise RuntimeError('REA MCP probe failed')
              print('REMOTE_EXIT '+json.dumps({'exitCode':result.get('exitCode',result.get('exit_code')),'truncated':result.get('truncated')}))
          except HTTPError as e: raise SystemExit('Diagnostic HTTP '+str(e.code)) from None
          PY_DIAG
