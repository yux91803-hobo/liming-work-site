name: Diagnose Tianqi REA
on:
  push:
    branches: [codex/xin-rea-diagnostic-20261120]
    paths: [.github/workflows/xin-rea-diagnostic.yml]
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reproduce REA startup in an isolated workspace and session store
        env:
          LI2_API_KEY: ${{ secrets.XIN_TQ_INSTABOX_API_KEY }}
        run: |
          python3 - <<'PY_DIAG'
          import json,os,re,hashlib
          from urllib.parse import quote,urlencode
          from urllib.request import Request,build_opener,HTTPRedirectHandler
          from urllib.error import HTTPError
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args): return None
          opener=build_opener(NoRedirect())
          base='https://api.instabox.sh/v1/machines'
          headers={'X-API-Key':os.environ['LI2_API_KEY'],'User-Agent':'Tianqi-rea-diagnostic'}
          def read(url,limit=2097152):
              with opener.open(Request(url,headers=headers),timeout=30) as r: b=r.read(limit+1)
              if len(b)>limit: raise ValueError('Read bound exceeded')
              return b
          
          try:
              machines=json.loads(read(base))['machines']
              matches=[m for m in machines if m.get('name')=='li2']
              if len(matches)!=1 or matches[0].get('state')!='running': raise ValueError('Expected running li2')
              url=base+'/'+quote(matches[0]['id'],safe='')+'/exec'
              payload={'argv':['python3','-c',"import json,os,signal,subprocess,tempfile\nfrom pathlib import Path\nhome=Path('/data/home')\nplugins=home/'.dsh/profiles/headless'\nkey=(home/'.xin/harness.key').read_text().strip()\npatch=home/'.xin/harness-persona.deepseek-v4.1-flash.max.purge-on.rea-on.yml'\nwith tempfile.TemporaryDirectory(prefix='tianqi-rea-check-',dir='/data/tmp') as d:\n    root=Path(d);(root/'dsh/profiles').mkdir(parents=True)\n    (root/'dsh/profiles/headless').symlink_to(plugins,target_is_directory=True)\n    env=os.environ.copy()\n    env.update({'DSH_HOME':str(root/'dsh'),'XIN_HARNESS_KEY':key,'DSH_PERMISSION_MODE':'danger-full-access'})\n    args=[str(home/'.local/bin/dsh'),'--profile','headless','--patch',str(patch),'--permission-mode','danger-full-access','--approval-policy','never','--json','Only reply REA_READY. Do not call tools or change files. This is an isolated plugin connection test.']\n    child=subprocess.Popen(args,cwd=root,env=env,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,start_new_session=True)\n    expired=False\n    try: out,err=child.communicate(timeout=80)\n    except subprocess.TimeoutExpired:\n        expired=True;os.killpg(child.pid,signal.SIGKILL);out,err=child.communicate(timeout=5)\n    finally:\n        try:os.killpg(child.pid,signal.SIGKILL)\n        except ProcessLookupError:pass\n    errors=[];types=[];ready=False\n    for line in out.splitlines():\n        try:event=json.loads(line)\n        except ValueError:continue\n        types.append(event.get('type'))\n        if event.get('type')=='error':errors.append(event)\n        if event.get('type')=='status' and event.get('phase')=='turn_end':errors.append({'turn_end':event.get('reason')})\n        if event.get('type') in ['text','final'] and 'REA_READY' in str(event.get('text','')):ready=True\n    raw=json.dumps({'code':child.returncode,'expired':expired,'ready':ready,'types':types,'errors':errors,'stderr_tail':err[-3500:]},ensure_ascii=False)\n    if key:raw=raw.replace(key,'[REDACTED]')\n    print('REA_NATIVE '+raw[:11000],flush=True)\n"],'timeoutSeconds':100,'noHistory':True}
              with opener.open(Request(url,headers={**headers,'Content-Type':'application/json'},data=json.dumps(payload).encode()),timeout=115) as r: result=json.load(r)
              for line in result.get('stdout','').splitlines():
                  if line.startswith('REA_NATIVE '):print(line,flush=True)
              print('REMOTE_EXIT '+json.dumps({'exitCode':result.get('exitCode',result.get('exit_code')),'truncated':result.get('truncated')}))
          except HTTPError as e: raise SystemExit('Diagnostic HTTP '+str(e.code)) from None
          PY_DIAG
