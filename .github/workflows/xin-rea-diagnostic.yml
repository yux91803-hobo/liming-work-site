name: Diagnose Tianqi REA
on:
  push:
    branches: [codex/xin-rea-diagnostic-20261120]
    paths: [.github/workflows/xin-rea-diagnostic.yml]
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reproduce REA startup in an isolated workspace and session store
        env:
          LI2_API_KEY: ${{ secrets.XIN_TQ_INSTABOX_API_KEY }}
        run: |
          python3 - <<'PY_DIAG'
          import json,os,re,hashlib
          from urllib.parse import quote,urlencode
          from urllib.request import Request,build_opener,HTTPRedirectHandler
          from urllib.error import HTTPError
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args): return None
          opener=build_opener(NoRedirect())
          base='https://api.instabox.sh/v1/machines'
          headers={'X-API-Key':os.environ['LI2_API_KEY'],'User-Agent':'Tianqi-rea-diagnostic'}
          def read(url,limit=2097152):
              with opener.open(Request(url,headers=headers),timeout=30) as r: b=r.read(limit+1)
              if len(b)>limit: raise ValueError('Read bound exceeded')
              return b
          
          try:
              machines=json.loads(read(base))['machines']
              matches=[m for m in machines if m.get('name')=='li2']
              if len(matches)!=1 or matches[0].get('state')!='running': raise ValueError('Expected running li2')
              url=base+'/'+quote(matches[0]['id'],safe='')+'/exec'
              payload={'argv':['python3','-c',"import json,os,signal,subprocess,tempfile,threading,time,re\nfrom pathlib import Path\nfrom http.server import BaseHTTPRequestHandler,HTTPServer\nfrom urllib.request import Request,urlopen\nfrom urllib.error import HTTPError\nhome=Path('/data/home')\nkey=(home/'.xin/harness.key').read_text().strip()\ncaptured={};received=threading.Event()\nclass Capture(BaseHTTPRequestHandler):\n    def log_message(self,*args):pass\n    def do_POST(self):\n        n=int(self.headers.get('Content-Length','0'))\n        if n>2097152:self.send_error(413);return\n        captured.update(json.loads(self.rfile.read(n)))\n        received.set()\n        body=b'{\"error\":{\"message\":\"isolated tool catalog capture\",\"type\":\"server_error\"}}'\n        self.send_response(400);self.send_header('Content-Type','application/json');self.end_headers();self.wfile.write(body)\nwith tempfile.TemporaryDirectory(prefix='tianqi-rea-schema-',dir='/data/tmp') as d:\n    root=Path(d);(root/'dsh/profiles').mkdir(parents=True)\n    (root/'dsh/profiles/headless').symlink_to(home/'.dsh/profiles/headless',target_is_directory=True)\n    patch=(home/'.xin/harness-persona.deepseek-v4.1-flash.max.purge-on.rea-on.yml').read_text()\n    server=HTTPServer(('127.0.0.1',0),Capture);threading.Thread(target=server.serve_forever,daemon=True).start()\n    patch=re.sub(r'(?m)^(\\s*baseURL: ).+$',r'\\g<1>\"http://127.0.0.1:'+str(server.server_port)+'/v1\"',patch)\n    p=root/'patch.yml';p.write_text(patch)\n    env=os.environ.copy();env.update({'DSH_HOME':str(root/'dsh'),'XIN_HARNESS_KEY':'isolated-capture','DSH_PERMISSION_MODE':'danger-full-access'})\n    args=[str(home/'.local/bin/dsh'),'--profile','headless','--patch',str(p),'--permission-mode','danger-full-access','--approval-policy','never','--json','Only reply OK. Do not call tools.']\n    child=subprocess.Popen(args,cwd=root,env=env,stdin=subprocess.DEVNULL,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,start_new_session=True)\n    try:\n        if not received.wait(40):raise RuntimeError('No tool catalog captured')\n    finally:\n        try:os.killpg(child.pid,signal.SIGKILL)\n        except ProcessLookupError:pass\n        child.wait(timeout=5);server.shutdown();server.server_close()\n    tools=captured.get('tools',[])\n    sizes=sorted([(len(json.dumps(t.get('parameters',{}))),t.get('name')) for t in tools],reverse=True)\n    print('REA_CATALOG '+json.dumps({'count':len(tools),'largest':sizes[:4]}),flush=True)\n    def remove(node,keys):\n        if isinstance(node,list):return [remove(n,keys) for n in node]\n        if isinstance(node,dict):return {k:remove(v,keys) for k,v in node.items() if k not in keys}\n        return node\n    binary=next(t for t in tools if t.get('name')=='mcp__rea__binary_session')\n    for label,items,keys in [('single-no-meta',[binary],{'$schema'}),('single-no-allOf',[binary],{'allOf'}),('all-no-allOf',tools,{'allOf'}),('all-no-allOf-pattern',tools,{'allOf','pattern'})]:\n        selected=[{**t,'parameters':remove(t.get('parameters',{}),keys)} for t in items]\n        payload=dict(captured)\n        payload.update({'input':[{'role':'user','content':'Only reply OK.'}],'tools':selected,'tool_choice':'none','max_output_tokens':64,'stream':False})\n        try:\n            with urlopen(Request('http://127.0.0.1:8788/v1/responses',headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'},data=json.dumps(payload).encode()),timeout=30) as r:\n                status=r.status;r.read(4096)\n            invalid=False\n        except HTTPError as e:\n            status=e.code;raw=e.read(8192).decode('utf-8','replace')\n            invalid=status==400 and ('invalid_function_parameters' in raw or '11129' in raw)\n            if not invalid:raise RuntimeError('Unexpected probe status '+str(status))\n        print('REA_SCHEMA_VARIANT '+json.dumps({'variant':label,'tools':len(selected),'status':status,'invalid':invalid}),flush=True)\n"],'timeoutSeconds':230,'noHistory':True}
              with opener.open(Request(url,headers={**headers,'Content-Type':'application/json'},data=json.dumps(payload).encode()),timeout=245) as r: result=json.load(r)
              for line in result.get('stdout','').splitlines():
                  if line.startswith(('REA_CATALOG ','REA_SCHEMA_VARIANT ')):print(line,flush=True)
              print('REMOTE_EXIT '+json.dumps({'exitCode':result.get('exitCode',result.get('exit_code')),'truncated':result.get('truncated')}))
          except HTTPError as e: raise SystemExit('Diagnostic HTTP '+str(e.code)) from None
          PY_DIAG
