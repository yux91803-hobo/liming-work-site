name: Diagnose Tianqi REA
on:
  push:
    branches: [codex/xin-rea-diagnostic-20261120]
    paths: [.github/workflows/xin-rea-diagnostic.yml]
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reproduce REA startup in an isolated workspace and session store
        env:
          LI2_API_KEY: ${{ secrets.XIN_TQ_INSTABOX_API_KEY }}
        run: |
          python3 - <<'PY_DIAG'
          import json,os,re,hashlib
          from urllib.parse import quote,urlencode
          from urllib.request import Request,build_opener,HTTPRedirectHandler
          from urllib.error import HTTPError
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args): return None
          opener=build_opener(NoRedirect())
          base='https://api.instabox.sh/v1/machines'
          headers={'X-API-Key':os.environ['LI2_API_KEY'],'User-Agent':'Tianqi-rea-diagnostic'}
          def read(url,limit=2097152):
              with opener.open(Request(url,headers=headers),timeout=30) as r: b=r.read(limit+1)
              if len(b)>limit: raise ValueError('Read bound exceeded')
              return b
          
          try:
              machines=json.loads(read(base))['machines']
              matches=[m for m in machines if m.get('name')=='li2']
              if len(matches)!=1 or matches[0].get('state')!='running': raise ValueError('Expected running li2')
              url=base+'/'+quote(matches[0]['id'],safe='')+'/exec'
              payload={'argv':['python3','-c',"import json,os,signal,subprocess,tempfile,re\nfrom pathlib import Path\nhome=Path('/data/home')\nplugins=home/'.dsh/profiles/headless'\nkey=(home/'.xin/harness.key').read_text().strip()\npatch=home/'.xin/harness-persona.deepseek-v4.1-flash.max.purge-on.rea-on.yml'\nwith tempfile.TemporaryDirectory(prefix='tianqi-rea-check-',dir='/data/tmp') as d:\n    root=Path(d);(root/'dsh/profiles').mkdir(parents=True)\n    (root/'dsh/profiles/headless').symlink_to(plugins,target_is_directory=True)\n    patch_text=patch.read_text()\n    bridge=\"\\nconst normalize = function reaInputSchema(schema) {\\n  if (!schema || typeof schema !== 'object' || Array.isArray(schema)) return schema;\\n  const out = { ...schema };\\n  if (Array.isArray(out.allOf) && out.allOf.length && out.allOf.every(x => x && typeof x.pattern === 'string' && Object.keys(x).length === 1)) delete out.allOf;\\n  for (const key of ['properties', 'patternProperties', '$defs', 'definitions', 'dependentSchemas']) {\\n    if (out[key] && typeof out[key] === 'object' && !Array.isArray(out[key])) out[key] = Object.fromEntries(Object.entries(out[key]).map(([name, value]) => [name, reaInputSchema(value)]));\\n  }\\n  for (const key of ['items', 'additionalProperties', 'unevaluatedProperties', 'contains', 'propertyNames', 'not', 'if', 'then', 'else']) {\\n    if (out[key] && typeof out[key] === 'object') out[key] = Array.isArray(out[key]) ? out[key].map(reaInputSchema) : reaInputSchema(out[key]);\\n  }\\n  for (const key of ['allOf', 'anyOf', 'oneOf', 'prefixItems']) if (Array.isArray(out[key])) out[key] = out[key].map(reaInputSchema);\\n  return out;\\n};\\nconst {spawn} = require('node:child_process'), {createInterface} = require('node:readline');\\nconst child = spawn(process.argv[1], [], {stdio:['pipe','pipe','inherit']}), lists = new Set();\\nlet ended = false, timer;\\nconst input = createInterface({input:process.stdin}), output = createInterface({input:child.stdout});\\ninput.on('line', line => {\\n  try { const m=JSON.parse(line); if(m.method==='tools/list' && m.id!=null) lists.add(m.id); } catch {}\\n  if(!child.stdin.destroyed) child.stdin.write(line+'\\\\n');\\n});\\noutput.on('line', line => {\\n  try {\\n    const m=JSON.parse(line);\\n    if(!m.method && lists.delete(m.id) && Array.isArray(m.result?.tools)) {\\n      m.result.tools=m.result.tools.map(t=>({...t,inputSchema:normalize(t.inputSchema)}));\\n      line=JSON.stringify(m);\\n    }\\n  } catch {}\\n  process.stdout.write(line+'\\\\n');\\n});\\ninput.on('close', () => {\\n  if(ended) return;\\n  child.stdin.end(); timer=setTimeout(()=>child.kill('SIGTERM'),1000);timer.unref();\\n});\\nchild.stdin.on('error',()=>{});\\nchild.on('error',()=>{process.stderr.write('REA MCP 启动失败\\\\n');process.exitCode=1;input.close();process.stdin.destroy();});\\nchild.on('close',code=>{ended=true;clearTimeout(timer);input.close();process.stdin.destroy();process.exitCode=Number.isInteger(code)?code:1;});\\nfor(const signal of ['SIGTERM','SIGINT']) process.on(signal,()=>child.kill(signal));\\n\"\n    args_json=json.dumps(['-e',bridge,str(home/'.local/bin/tianqi-rea-mcp')])\n    patch_text=re.sub(r'(?m)^        command: .+$',lambda m:'        command: \"/data/apps/deepseek-harness/runtime/bin/node\"\\n        args: '+args_json,patch_text)\n    patch=root/'verified-patch.yml';patch.write_text(patch_text)\n    env=os.environ.copy()\n    env.update({'DSH_HOME':str(root/'dsh'),'XIN_HARNESS_KEY':key,'DSH_PERMISSION_MODE':'danger-full-access'})\n    args=[str(home/'.local/bin/dsh'),'--profile','headless','--patch',str(patch),'--permission-mode','danger-full-access','--approval-policy','never','--json','Call mcp__rea__binary_session once to check whether a binary is open. Do not open or modify files or use other tools. Finish with REA_READY. This is an isolated REA compatibility test.']\n    child=subprocess.Popen(args,cwd=root,env=env,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,start_new_session=True)\n    expired=False\n    try: out,err=child.communicate(timeout=80)\n    except subprocess.TimeoutExpired:\n        expired=True;os.killpg(child.pid,signal.SIGKILL);out,err=child.communicate(timeout=5)\n    finally:\n        try:os.killpg(child.pid,signal.SIGKILL)\n        except ProcessLookupError:pass\n    errors=[];types=[];ready=False;tools=[]\n    for line in out.splitlines():\n        try:event=json.loads(line)\n        except ValueError:continue\n        types.append(event.get('type'))\n        if event.get('type') in ['tool_call','tool_result']:tools.append({'type':event.get('type'),'tool':event.get('tool'),'status':event.get('status')})\n        if event.get('type')=='error':errors.append(event)\n        if event.get('type')=='status' and event.get('phase')=='turn_end':errors.append({'turn_end':event.get('reason')})\n        if event.get('type') in ['text','final'] and 'REA_READY' in str(event.get('text','')):ready=True\n    raw=json.dumps({'code':child.returncode,'expired':expired,'ready':ready,'types':types,'tools':tools,'errors':errors,'stderr_tail':err[-3500:]},ensure_ascii=False)\n    if key:raw=raw.replace(key,'[REDACTED]')\n    print('REA_NATIVE '+raw[:11000],flush=True)\n"],'timeoutSeconds':120,'noHistory':True}
              with opener.open(Request(url,headers={**headers,'Content-Type':'application/json'},data=json.dumps(payload).encode()),timeout=135) as r: result=json.load(r)
              for line in result.get('stdout','').splitlines():
                  if line.startswith('REA_NATIVE '):print(line,flush=True)
              print('REMOTE_EXIT '+json.dumps({'exitCode':result.get('exitCode',result.get('exit_code')),'truncated':result.get('truncated')}))
          except HTTPError as e: raise SystemExit('Diagnostic HTTP '+str(e.code)) from None
          PY_DIAG
