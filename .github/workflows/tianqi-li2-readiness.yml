name: Tianqi li2 gateway state
on:
  push:
    branches: [codex/tianqi-li2-readiness-20261118]
    paths: [.github/workflows/tianqi-li2-readiness.yml]
permissions: {}
jobs:
  inspect:
    if: github.repository == 'yux91803-hobo/liming-work-site' && github.ref_name == 'codex/tianqi-li2-readiness-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check installed local gateway and account directory metadata
        env:
          LI2_API_KEY: ${{ secrets.XIN_TQ_INSTABOX_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote, urlencode
          from urllib.request import HTTPRedirectHandler, Request, build_opener


          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None


          def client(env):
              key = os.environ.get(env)
              if not key:
                  raise RuntimeError('Required InstaBox secret unavailable')
              opener = build_opener(NoRedirect())
              def send(path, data=None):
                  req = Request('https://api.instabox.sh' + path, data=data, headers={'X-API-Key': key, 'Content-Type': 'application/json'})
                  with opener.open(req, timeout=50) as res:
                      return json.load(res)
              return send


          def select(send, name):
              matches = [m['id'] for m in send('/v1/machines')['machines'] if m.get('name') == name]
              if len(matches) != 1:
                  raise RuntimeError('Expected exactly one ' + name)
              return '/v1/machines/' + quote(matches[0], safe='')


          TARGET="import http.client\nimport json\nimport re\nimport subprocess\nfrom pathlib import Path\n\n\ndef get(path):\n    connection=http.client.HTTPConnection('127.0.0.1',8788,timeout=8)\n    try:\n        connection.request('GET',path)\n        response=connection.getresponse()\n        return response.status,response.read(262144) if path=='/health' else b''\n    finally:\n        connection.close()\n\nhealth,body=get('/health')\ndashboard,_=get('/dashboard')\ntry:\n    data=json.loads(body)\nexcept (ValueError,TypeError):\n    data={}\ncounts={k:data[k] for k in ('accounts','account_count','accountCount','loaded_accounts','loadedAccounts','ready_accounts','readyAccounts')\n        if k in data and type(data[k]) is int and data[k] >= 0}\nversion=next((data[key] for key in ('version','app_version','appVersion')\n              if isinstance(data.get(key),str) and re.fullmatch(r'v?[0-9]+\\.[0-9]+\\.[0-9]+',data[key])),None)\nroot=Path('/data/workbuddy-gateway/accounts')\nknown={'accounts.json','realms.json','realm_registry.json','realms_index.json','_realms.json','.gitkeep','registry.json','README.md','settings.json'}\nmetadata=[]\nfor p in sorted(root.iterdir()):\n    if p.is_symlink():\n        metadata.append({'name_kind':'other','type':'symlink'})\n    elif p.is_file():\n        metadata.append({'name_kind':p.name if p.name in known else 'other','type':'file','bytes':p.stat().st_size})\n    elif p.is_dir():\n        metadata.append({'name_kind':'other','type':'directory'})\nserved=subprocess.run(['systemctl','is-active','workbuddy-gateway.service'],capture_output=True,timeout=10).returncode==0\nif health!=200 or dashboard!=200 or not served:\n    raise SystemExit('The installed gateway did not pass the read-only state check')\nprint(json.dumps({'health_http':health,'dashboard_http':dashboard,'gateway_version':version,'reported_account_counts':counts,\n                  'account_directory_metadata':metadata,'harness_gateway_key_present':Path('/data/home/.xin/harness.key').is_file()},sort_keys=True))\n"

          if __name__ == '__main__':
              try:
                  api = client('LI2_API_KEY')
                  reply = api(select(api,'li2')+'/exec',json.dumps({'argv':['/usr/bin/python3','-c',TARGET],'timeoutSeconds':30}).encode())
                  if reply.get('exitCode')!=0:
                      raise SystemExit('Read-only installation diagnostic did not finish')
                  print('LI2_FINAL_STATE '+json.dumps(json.loads(reply['stdout']),sort_keys=True))
              except HTTPError as error:
                  raise SystemExit('InstaBox returned HTTP '+str(error.code)) from None
              except (URLError, TimeoutError, ValueError, KeyError, OSError):
                  raise SystemExit('Installation diagnostic status was unavailable') from None
          PY
