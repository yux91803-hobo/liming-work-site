name: Tianqi li2 installation diagnosis
on:
  push:
    branches: [codex/tianqi-li2-readiness-20261118]
    paths: [.github/workflows/tianqi-li2-readiness.yml]
permissions: {}
jobs:
  inspect:
    if: github.repository == 'yux91803-hobo/liming-work-site' && github.ref_name == 'codex/tianqi-li2-readiness-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read safe rollback and service status
        env:
          LI2_API_KEY: ${{ secrets.XIN_TQ_INSTABOX_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote, urlencode
          from urllib.request import HTTPRedirectHandler, Request, build_opener


          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None


          def client(env):
              key = os.environ.get(env)
              if not key:
                  raise RuntimeError('Required InstaBox secret unavailable')
              opener = build_opener(NoRedirect())
              def send(path, data=None):
                  req = Request('https://api.instabox.sh' + path, data=data, headers={'X-API-Key': key, 'Content-Type': 'application/json'})
                  with opener.open(req, timeout=50) as res:
                      return json.load(res)
              return send


          def select(send, name):
              matches = [m['id'] for m in send('/v1/machines')['machines'] if m.get('name') == name]
              if len(matches) != 1:
                  raise RuntimeError('Expected exactly one ' + name)
              return '/v1/machines/' + quote(matches[0], safe='')


          TARGET='import json\nimport os\nimport re\nimport subprocess\nfrom pathlib import Path\n\nwork=Path(\'/data/tmp/liming-tq-setup/44304737022-1\')\nharness=work/\'new/harness\'\ngateway=work/\'new/gateway/current\'\nlogs=subprocess.run(([\'sudo\',\'-n\'] if os.geteuid() else []) + [\'journalctl\',\'-u\',\'workbuddy-gateway.service\',\'-n\',\'100\',\'-o\',\'cat\',\'--no-pager\'],\n                    timeout=8,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True).stdout\nkinds=sorted({m for m in (\'ModuleNotFoundError\',\'PermissionError\',\'FileNotFoundError\',\'Address already in use\',\n                          \'unrecognized arguments\',\'Traceback\',\'API key is required\',\'panel password\',\'status=203/EXEC\',\n                          \'start request repeated\',\'ValueError\') if m.lower() in logs.lower()})\nhttp_codes=[int(code) for code in re.findall(r\'"GET /(?:\\?[^ ]*)? HTTP/[0-9.]+" ([1-5][0-9]{2})\',logs)]\nprogram=(gateway/\'wb_proxy.py\').read_text(errors=\'replace\') if (gateway/\'wb_proxy.py\').is_file() else \'\'\nroutes=[s for s in (\'/health\',\'/healthz\',\'/dashboard\',\'/panel\',\'/v1/models\',\'/api/status\',\'/login\') if s in program]\nmissing=sorted(set(re.findall(r"ModuleNotFoundError: No module named [\'\\"]([A-Za-z0-9_.]+)[\'\\"]",logs)))\nprint(json.dumps({\'rollback_has_unit\':(work/\'rolled-back.service\').is_file(),\'staged_harness\':harness.is_dir(),\n                  \'staged_gateway\':gateway.is_dir(),\'gateway_journal_categories\':kinds,\'root_http_codes\':http_codes[-8:],\n                  \'loopback_mentioned\':bool(re.search(r\'127\\.0\\.0\\.1:8788\',logs)),\'missing_modules\':missing,\'route_literals\':routes}))\n'

          if __name__ == '__main__':
              try:
                  api = client('LI2_API_KEY')
                  reply = api(select(api,'li2')+'/exec',json.dumps({'argv':['/usr/bin/python3','-c',TARGET],'timeoutSeconds':30}).encode())
                  if reply.get('exitCode')!=0:
                      raise SystemExit('Read-only installation diagnostic did not finish')
                  print('LI2_INSTALL_DIAG '+json.dumps(json.loads(reply['stdout']),sort_keys=True))
              except HTTPError as error:
                  raise SystemExit('InstaBox returned HTTP '+str(error.code)) from None
              except (URLError, TimeoutError, ValueError, KeyError, OSError):
                  raise SystemExit('Installation diagnostic status was unavailable') from None
          PY
