name: Tianqi li2 browser verification
on:
  push:
    branches: [codex/tianqi-li2-readiness-20261118]
    paths: [.github/workflows/tianqi-li2-readiness.yml]
permissions: {}
jobs:
  inspect:
    if: github.repository == 'yux91803-hobo/liming-work-site' && github.ref_name == 'codex/tianqi-li2-readiness-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the browser test client
        run: |
          pip install playwright==1.64.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install chromium
          fi
      - name: Verify the installed controller using normal Tianqi login
        env:
          SITE_OWNER_PASSWORD: ${{ secrets.XIN_OWNER_PASSWORD }}
        run: |
          python3 - <<'PY'
          import asyncio
          import json
          import os
          from playwright.async_api import Error, TimeoutError, async_playwright

          BASE='https://liming-work.com'
          PASSWORD=os.environ.get('SITE_OWNER_PASSWORD')

          async def verify():
              if not PASSWORD:
                  raise SystemExit('The owner login secret is unavailable')
              observations = []
              pings = []
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, **({'executable_path':os.environ['CHROMIUM_PATH']} if os.environ.get('CHROMIUM_PATH') else {}))
                  ctx=await browser.new_context()
                  page=await ctx.new_page()
                  pending = set()
                  async def observe(response):
                      if not response.url.startswith(BASE+'/api/tq/'):
                          return
                      path=response.url.removeprefix(BASE)
                      if path in {'/api/tq/me','/api/tq/login'}:
                          observations.append({'path':path,'status':response.status,'json':'json' in response.headers.get('content-type','')})
                      if path=='/api/tq/call':
                          args=response.request.post_data_json
                          if args.get('op')!='ping': return
                          if response.status!=200:
                              observations.append({'path':'ping','status':response.status,'json':'json' in response.headers.get('content-type','')})
                              return
                          reply=await response.json()
                          if reply.get('ok') and reply.get('data',{}).get('role')=='tianqi':
                              ready=reply['data'].get('ready')
                              if isinstance(ready,bool): pings.append(ready)
                          else:
                              state=reply.get('state')
                              observations.append({'path':'ping','status':response.status,'state':state if state in {'busy','waking','error','cooldown'} else 'other'})
                  def capture(response):
                      task=asyncio.create_task(observe(response))
                      pending.add(task)
                      task.add_done_callback(pending.discard)
                  page.on('response',capture)
                  try:
                      await page.goto(BASE+'/tianqi',wait_until='domcontentloaded',timeout=45000)
                      frame=page.frame_locator('.panel[data-id=tianqi] iframe')
                      await frame.locator('.xc-login input[name=pw]').fill(PASSWORD,timeout=35000)
                      await frame.locator('.xc-login button').click(timeout=15000)
                      await frame.locator('.xc-hello.tq').wait_for(timeout=40000)
                      for _ in range(110):
                          if pings: break
                          await asyncio.sleep(0.8)
                      if not pings:
                          raise TimeoutError('Tianqi controller readiness was not observed')
                      if not pings[-1]:
                          await frame.get_by_text('天启的网关还没配好',exact=False).first.wait_for(timeout=10000)
                      login=await ctx.request.get(BASE+'/api/xin/me',timeout=20000)
                      if login.status!=200 or (await login.json()).get('authed') is not True:
                          raise RuntimeError('Shared site login was not observed')
                      print('LI2_BROWSER '+json.dumps({'controller_role':'tianqi','ready':pings[-1],
                                                       'shared_owner_login':True,'gateway_pending_visible':not pings[-1]},sort_keys=True))
                  except (Error, RuntimeError, KeyError, ValueError, TypeError):
                      print('LI2_BROWSER_DIAG '+json.dumps(observations[-12:]))
                      raise SystemExit('Browser readiness verification failed') from None
                  finally:
                      await asyncio.gather(*list(pending),return_exceptions=True)
                      await browser.close()

          asyncio.run(verify())
          PY
