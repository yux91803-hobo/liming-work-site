name: Tianqi li2 isolated gateway probe
on:
  push:
    branches: [codex/tianqi-li2-readiness-20261118]
    paths: [.github/workflows/tianqi-li2-readiness.yml]
permissions: {}
jobs:
  inspect:
    if: github.repository == 'yux91803-hobo/liming-work-site' && github.ref_name == 'codex/tianqi-li2-readiness-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe staged gateway on a temporary local port
        env:
          LI2_API_KEY: ${{ secrets.XIN_TQ_INSTABOX_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote, urlencode
          from urllib.request import HTTPRedirectHandler, Request, build_opener


          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None


          def client(env):
              key = os.environ.get(env)
              if not key:
                  raise RuntimeError('Required InstaBox secret unavailable')
              opener = build_opener(NoRedirect())
              def send(path, data=None):
                  req = Request('https://api.instabox.sh' + path, data=data, headers={'X-API-Key': key, 'Content-Type': 'application/json'})
                  with opener.open(req, timeout=50) as res:
                      return json.load(res)
              return send


          def select(send, name):
              matches = [m['id'] for m in send('/v1/machines')['machines'] if m.get('name') == name]
              if len(matches) != 1:
                  raise RuntimeError('Expected exactly one ' + name)
              return '/v1/machines/' + quote(matches[0], safe='')


          TARGET='import http.client\nimport json\nimport os\nimport re\nimport socket\nimport subprocess\nimport tempfile\nimport time\nfrom pathlib import Path\n\nwork=Path(\'/data/tmp/liming-tq-setup/44304737022-1\')\nprogram=work/\'new/gateway/current/wb_proxy.py\'\nif not program.is_file():\n    raise SystemExit(\'The staged gateway source was unavailable\')\nwith socket.socket() as reserved:\n    reserved.bind((\'127.0.0.1\',0))\n    port=reserved.getsockname()[1]\nwith tempfile.TemporaryDirectory(prefix=\'tq-gateway-probe-\',dir=work) as tmp:\n    scratch=Path(tmp)\n    for folder in (\'accounts\',\'usage\'):\n        (scratch/folder).mkdir()\n    with (scratch/\'out\').open(\'wb\') as out:\n        command=[\'/usr/bin/python3\',str(program),\'--host\',\'127.0.0.1\',\'--port\',str(port),\n                 \'--accounts-dir\',str(scratch/\'accounts\'),\'--usage-dir\',str(scratch/\'usage\')]\n        proc=subprocess.Popen(command,cwd=program.parent,stdout=out,stderr=out,stdin=subprocess.DEVNULL,\n                              env={\'PATH\':os.defpath,\'LANG\':\'C.UTF-8\',\'PYTHONDONTWRITEBYTECODE\':\'1\'})\n        result={\'routes\':{},\'exit_before_response\':None,\'request_errors\':[]}\n        try:\n            end=time.monotonic()+12\n            while time.monotonic()<end and proc.poll() is None:\n                for route in (\'/\',\'/health\',\'/dashboard\',\'/panel\'):\n                    connection=http.client.HTTPConnection(\'127.0.0.1\',port,timeout=0.8)\n                    try:\n                        connection.request(\'GET\',route)\n                        result[\'routes\'][route]=connection.getresponse().status\n                    except (OSError,http.client.HTTPException) as error:\n                        name=type(error).__name__\n                        if name not in result[\'request_errors\']:\n                            result[\'request_errors\'].append(name)\n                    finally:\n                        connection.close()\n                if result[\'routes\']:\n                    break\n                time.sleep(0.3)\n            result[\'exit_before_response\']=proc.poll()\n        finally:\n            if proc.poll() is None:\n                proc.terminate()\n                try:\n                    proc.wait(timeout=4)\n                except subprocess.TimeoutExpired:\n                    proc.kill()\n                    proc.wait()\n    summary=(scratch/\'out\').read_text(errors=\'replace\')\nresult[\'process_categories\']=sorted({m for m in (\'ModuleNotFoundError\',\'PermissionError\',\'FileNotFoundError\',\'Address already in use\',\n                     \'unrecognized arguments\',\'Traceback\',\'API key is required\',\'panel password\',\'ValueError\',\'SystemExit\') if m.lower() in summary.lower()})\nresult[\'missing_modules\']=sorted(set(re.findall(r"ModuleNotFoundError: No module named [\'\\"]([A-Za-z0-9_.]+)[\'\\"]",summary)))\nlog=subprocess.run(([\'sudo\',\'-n\'] if os.geteuid() else []) + [\'journalctl\',\'-u\',\'workbuddy-gateway.service\',\'-n\',\'120\',\'-o\',\'cat\',\'--no-pager\'],\n                   timeout=10,capture_output=True,text=True)\nresult[\'journal_lines\']=len(log.stdout.splitlines())\nresult[\'journal_exit\']=log.returncode\nresult[\'journal_categories\']=sorted({m for m in (\'Started\',\'Stopping\',\'Stopped\',\'failed\',\'exited\',\'permission denied\',\'refusing\',\n                        \'status=200/CHDIR\',\'status=217/USER\',\'status=1/FAILURE\',\'invalid argument\') if m.lower() in log.stdout.lower()})\nprint(json.dumps(result,sort_keys=True))\n'

          if __name__ == '__main__':
              try:
                  api = client('LI2_API_KEY')
                  reply = api(select(api,'li2')+'/exec',json.dumps({'argv':['/usr/bin/python3','-c',TARGET],'timeoutSeconds':30}).encode())
                  if reply.get('exitCode')!=0:
                      raise SystemExit('Read-only installation diagnostic did not finish')
                  print('LI2_GATEWAY_PROBE '+json.dumps(json.loads(reply['stdout']),sort_keys=True))
              except HTTPError as error:
                  raise SystemExit('InstaBox returned HTTP '+str(error.code)) from None
              except (URLError, TimeoutError, ValueError, KeyError, OSError):
                  raise SystemExit('Installation diagnostic status was unavailable') from None
          PY
