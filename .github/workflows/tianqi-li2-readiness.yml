name: Tianqi li2 commissioning checks
on:
  push:
    branches: [codex/tianqi-li2-readiness-20261118]
    paths: [.github/workflows/tianqi-li2-readiness.yml]
permissions: {}
jobs:
  inspect:
    if: github.repository == 'yux91803-hobo/liming-work-site' && github.ref_name == 'codex/tianqi-li2-readiness-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify li2 before program installation
        env:
          LI_API_KEY: ${{ secrets.XIN_INSTABOX_API_KEY }}
          LI2_API_KEY: ${{ secrets.XIN_TQ_INSTABOX_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote, urlencode
          from urllib.request import HTTPRedirectHandler, Request, build_opener


          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None


          def client(env):
              key = os.environ.get(env)
              if not key:
                  raise RuntimeError('Required InstaBox secret unavailable')
              opener = build_opener(NoRedirect())
              def send(path, data=None):
                  req = Request('https://api.instabox.sh' + path, data=data, headers={'X-API-Key': key, 'Content-Type': 'application/json'})
                  with opener.open(req, timeout=50) as res:
                      return json.load(res)
              return send


          def select(send, name):
              matches = [m['id'] for m in send('/v1/machines')['machines'] if m.get('name') == name]
              if len(matches) != 1:
                  raise RuntimeError('Expected exactly one ' + name)
              return '/v1/machines/' + quote(matches[0], safe='')


          def profile_structure(entry, depth=0):
              if depth > 3:
                  return type(entry).__name__
              if isinstance(entry, dict):
                  return {k: profile_structure(v, depth+1) for k,v in entry.items() if re.fullmatch(r'[a-zA-Z][a-zA-Z0-9_-]{0,60}',k)}
              if isinstance(entry, list):
                  return [profile_structure(v, depth+1) for v in entry[:12]]
              if isinstance(entry, str) and (entry in {'headless','default','cli','standard','minimal','builtin','chat','codex','global','local'} or re.fullmatch(r'(?:builtin:|@deepseek-ai/dsh[/\w.-]*)(?:headless)?',entry)):
                  return entry
              return type(entry).__name__


          TARGET = '''import json, os, shutil, socket, subprocess
          from pathlib import Path
          home=Path('/data/home')
          role=json.loads((home/'.xin/kernel.env.json').read_text()).get('XIN_ROLE')
          with socket.socket() as sock:
           sock.settimeout(0.5)
           port_open=sock.connect_ex(('127.0.0.1',8788))==0
          paths={'harness':Path('/data/apps/deepseek-harness'),'launcher':home/'.local/bin/dsh','headless':home/'.dsh/profiles/headless','gateway':Path('/data/workbuddy-gateway'),'service':Path('/etc/systemd/system/workbuddy-gateway.service')}
          sudo=bool(shutil.which('sudo')) and subprocess.run(['sudo','-n','true'],timeout=5,capture_output=True).returncode==0
          print(json.dumps({'role_is_tianqi':role=='tianqi','expected_home':Path.home()==home,'x86_64':os.uname().machine=='x86_64','free_mib':shutil.disk_usage('/data').free//(1024*1024),'port_in_use':port_open,'sudo_available':sudo or os.geteuid()==0,'existing':{k:p.exists() or p.is_symlink() for k,p in paths.items()}}))
          '''


          def main():
              src = client('LI_API_KEY')
              target = client('LI2_API_KEY')
              li = select(src, 'li')
              li2 = select(target, 'li2')
              if li == li2:
                  raise RuntimeError('Source and destination must be distinct')
              profile = src(li + '/files?' + urlencode({'path':'/data/home/.dsh/profiles/headless/package.json'}))
              structure = profile_structure(json.loads(profile['content']).get('dsh', {}).get('profile'))
              report = target(li2 + '/exec', json.dumps({'argv':['/usr/bin/python3','-c',TARGET],'timeoutSeconds':30}).encode())
              if report.get('exitCode') != 0:
                  raise RuntimeError('li2 commission checks failed')
              result = json.loads(report['stdout'])
              print('LI2_COMMISSION ' + json.dumps({'headless_profile_structure':structure,'target':result}, sort_keys=True))


          if __name__ == '__main__':
              try:
                  main()
              except HTTPError as error:
                  raise SystemExit('InstaBox returned HTTP ' + str(error.code)) from None
              except (URLError, TimeoutError):
                  raise SystemExit('InstaBox connection did not complete') from None
              except (ValueError, KeyError, TypeError, OSError):
                  raise SystemExit('Unexpected commission data') from None
          PY
