name: Verify Neon Argon rollout
on:
  push:
    branches: [codex/xin-neon-argon-release-20261119]
    paths: [.github/workflows/xin-neon-argon-release.yml]
permissions: {}
jobs:
  verify:
    if: github.repository == 'yux91803-hobo/liming-work-site' && github.ref_name == 'codex/xin-neon-argon-release-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify quota records and resident kernels after rollout
        env:
          LI_API_KEY: ${{ secrets.XIN_INSTABOX_API_KEY }}
          LI2_API_KEY: ${{ secrets.XIN_TQ_INSTABOX_API_KEY }}
          XIN_OWNER_PASSWORD: ${{ secrets.XIN_OWNER_PASSWORD }}
        run: |
          python3 - <<'PY_REMOTE'
          import http.cookiejar
          import json
          import os
          import re
          import time
          from urllib.error import HTTPError
          from urllib.parse import quote, urlencode
          from urllib.request import HTTPCookieProcessor, HTTPRedirectHandler, Request, build_opener


          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None


          def verify_tianqi_kernel():
              site = 'https://liming-work.com'
              opener = build_opener(NoRedirect(), HTTPCookieProcessor(http.cookiejar.CookieJar()))

              def post(path, data):
                  request = Request(site+path, data=json.dumps(data).encode(), headers={
                      'Content-Type':'application/json','X-Xin':'1','Origin':site})
                  with opener.open(request, timeout=55) as response:
                      return json.loads(response.read(2*1024*1024))

              post('/api/tq/login', {'password':os.environ['XIN_OWNER_PASSWORD']})
              deadline = time.monotonic()+130
              while time.monotonic()<deadline:
                  result = post('/api/tq/call', {'op':'usage','args':{}})
                  owner = (result.get('data') or {}).get('owner') or {}
                  if result.get('ok') and owner.get('kernelCurrent') is True and owner.get('phase')=='running':
                      print('TIANQI_KERNEL',json.dumps({'current':True,'phase':'running'}),flush=True)
                      return
                  time.sleep(3)
              raise ValueError('Tianqi resident kernel did not reach its deployed version')


          def inspect(secret, name):
              opener = build_opener(NoRedirect())
              headers = {'X-API-Key': os.environ[secret]}
              base = 'https://api.instabox.sh/v1/machines'

              def read(url, limit=65536):
                  with opener.open(Request(url, headers=headers), timeout=20) as response:
                      raw = response.read(limit+1)
                  if len(raw) > limit:
                      raise ValueError('Read exceeded limit')
                  return raw

              records = json.loads(read(base, 512*1024))['machines']
              matching = [m for m in records if m.get('name') == name]
              if len(matching) != 1:
                  raise ValueError('Expected a single named machine')
              machine = matching[0]
              files = base+'/'+quote(machine['id'], safe='')+'/files/content?'

              def file(path):
                  try:
                      return read(files+urlencode({'path':path}))
                  except HTTPError as error:
                      if error.code == 404:
                          return b''
                      raise

              unit = file('/data/home/.config/systemd/user/xin-kernel-resident.service').decode()
              versions = sorted(set(re.findall(r'vm-kernel-([a-f0-9]{12})\.mjs',unit)))
              current = json.loads(file('/data/home/.xin/controller-current.json') or b'{}')
              match = re.search(r'/vm-agent-([a-f0-9]{12})\.mjs$',str(current.get('self','')))
              result = {'machine':name,'state':machine.get('state'),'service_kernel':versions,
                        'controller':match.group(1) if match else None}
              if result['controller'] != 'f2565b111b5d':
                  raise ValueError('Controller build differs from deployed test tree')
              if name == 'li':
                  quota = json.loads(file('/data/home/.xin/antigravity-argon-quota.json') or b'{}')
                  result['argon'] = {'model':quota.get('model') if quota.get('model') == 'gemini-4-argon' else None,
                                     'blocked':quota.get('blocked') is True,
                                     'weekly_bucket':any(b.get('id')=='gemini-argon-wtu-weekly' for b in quota.get('buckets',[]))}
                  if result['argon']['model'] != 'gemini-4-argon' or not result['argon']['weekly_bucket']:
                      raise ValueError('Argon reading was not recorded')
              print('RELEASE_STATE', json.dumps(result,sort_keys=True), flush=True)


          try:
              inspect('LI_API_KEY','li')
              verify_tianqi_kernel()
              inspect('LI2_API_KEY','li2')
          except HTTPError as error:
              raise SystemExit('Read-only verification returned HTTP '+str(error.code)) from None
          except (OSError,ValueError,KeyError,TypeError) as error:
              raise SystemExit('Read-only verification failed '+type(error).__name__) from None
          PY_REMOTE
