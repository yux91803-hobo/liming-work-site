<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liming 工具箱</title>
<meta name="description" content="Liming 的个人工具箱">
<meta name="theme-color" content="#f5f6f8" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工具箱">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>
  (function(){try{var t=localStorage.getItem('lm.theme')||'light';var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();
</script>
<link rel="stylesheet" href="/shell.css?v=fcd48065">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<main id="home">
  <header class="hd">
    <div>
      <div class="kicker">Liming</div>
      <h1>工具箱</h1>
    </div>
    <button id="themeBtn" class="round" aria-label="切换主题">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
      <svg class="auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" class="fill"/></svg>
    </button>
  </header>

  <label class="cmd" id="cmd">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="搜索工具" autocomplete="off" enterkeyhint="go" aria-label="搜索工具">
    <kbd>/</kbd>
  </label>

  <section id="recentWrap" hidden>
    <h2>最近</h2>
    <div id="recent" class="chips"></div>
  </section>

  <section>
    <h2 id="allTitle">全部</h2>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>没有找到</p>
  </section>
</main>

<div id="stage"></div>
<div id="toast" role="status"></div>

<script src="/tools.js"></script>
<script src="/shell.js?v=9f16e893"></script>
</body>
</html>
