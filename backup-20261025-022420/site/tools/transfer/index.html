<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f5f6f8">
<title>互传 · Liming 工具箱</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>
  (function(){var h=document.documentElement;try{if(window.self!==window.top)h.classList.add('embed');}catch(e){h.classList.add('embed');}
  try{var t=localStorage.getItem('lm.theme')||'light';h.dataset.theme=(t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light';}catch(e){}})();
</script>
<link rel="stylesheet" href="transfer.css">
</head>
<body>
<div class="bg"><i></i><i></i></div>
<a id="home" class="fab" href="/" aria-label="返回工具箱"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>

<!-- 登录 -->
<section id="login" hidden>
  <form id="loginForm" class="lcard" autocomplete="on">
    <div class="lic"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="3"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg></div>
    <h1>互传</h1>
    <p class="sub">输入访问密码</p>
    <input type="text" name="username" value="liming" autocomplete="username" hidden>
    <div class="pw"><input id="pw" type="password" autocomplete="current-password" placeholder="密码" enterkeyhint="go" required>
      <button id="go" type="submit" aria-label="进入"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
    <p id="lerr" class="err"></p>
  </form>
</section>

<!-- 主界面 -->
<main id="app" hidden>
  <header id="top">
    <div class="ttl"><b>互传</b><span id="live" class="live" title="连接状态"></span></div>
    <button id="menuBtn" class="fab sm" aria-label="更多"><svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.4" class="fill"/><circle cx="12" cy="12" r="1.4" class="fill"/><circle cx="18.5" cy="12" r="1.4" class="fill"/></svg></button>
  </header>

  <section id="compose" class="card">
    <textarea id="text" rows="1" placeholder="输入或粘贴文字" enterkeyhint="send"></textarea>
    <div class="row">
      <label class="btn ghost" id="pick"><input id="file" type="file" multiple hidden>
        <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg><span>文件 / 照片</span></label>
      <span class="hint desk">或拖拽、粘贴到此处</span>
      <button id="send" class="btn pri" disabled><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span>发送</span></button>
    </div>
  </section>

  <div id="usage"><div class="bar"><i id="usedBar"></i></div><span id="usedTxt"></span></div>

  <ul id="list"></ul>
  <div id="empty" hidden><svg viewBox="0 0 24 24"><path d="M4 13l2.5-7h11L20 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M4 13h5l1 2h4l1-2h5"/></svg><p>还没有内容</p><small>在另一台设备打开 liming-work.com/transfer 即可看到</small></div>
</main>

<div id="drop"><div><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg><b>松开即可上传</b></div></div>

<div id="scrim"></div>
<div id="sheet" role="dialog" aria-label="更多">
  <div class="grip"></div>
  <button class="sitem" id="refresh"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>刷新</button>
  <button class="sitem danger" id="clearAll"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>清空全部</button>
  <button class="sitem" id="logout"><svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg>退出本设备</button>
  <p class="limits" id="limitsTxt"></p>
</div>

<div id="viewer" hidden><img id="vimg" alt=""><button id="vclose" class="fab" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg></button></div>
<div id="confirm" hidden><div class="cbox"><p id="ctext"></p><div class="crow"><button id="cno" class="btn ghost">取消</button><button id="cyes" class="btn danger">确定</button></div></div></div>
<div id="toast" role="status"></div>
<script src="transfer.js"></script>
</body>
</html>
