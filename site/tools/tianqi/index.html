<!doctype html>
<html lang="zh-CN" class="tianqi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1019" id="themeColor">
<title>天启 · Liming 工具箱</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>
  (function () {
    var h = document.documentElement;
    try { if (window.self !== window.top) h.classList.add('embed'); } catch (e) { h.classList.add('embed'); }
    if (/(?:^|[?&])embed=1(?:&|$)/.test(location.search)) h.classList.add('embed');
    var mq = window.matchMedia && matchMedia('(prefers-color-scheme: dark)');
    function apply() {
      var t = 'light';
      try { t = localStorage.getItem('lm.theme') || 'light'; } catch (e) {}
      var d = t === 'dark' || (t === 'auto' && mq && mq.matches);
      h.dataset.theme = d ? 'dark' : 'light';
      h.dataset.pref = t;
      var m = document.getElementById('themeColor');
      if (m) m.setAttribute('content', d ? '#090c14' : '#0d1019');
    }
    apply();
    if (mq && mq.addEventListener) mq.addEventListener('change', apply);
    window.addEventListener('storage', function (e) { if (e.key === 'lm.theme') apply(); });
    window.addEventListener('message', function (e) { if (e.origin === location.origin && e.data && e.data.type === 'theme') apply(); });
  })();
</script>
<link rel="stylesheet" href="/pixel.css?v=px3">
<link rel="stylesheet" href="/xin/chat.css?v=motion-20261119">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1019;color:#f1f4fe}
  [data-theme=dark],[data-theme=dark] body{background:#090c14}
  button,input,textarea{font:inherit;color:inherit}
  button{border:0;background:none;padding:0;cursor:pointer}
</style>
<link rel="stylesheet" href="/tools/tianqi/workbench.css?v=desk-20261119">
</head>
<body>
<template id="tianqi-workbench">
  <header class="tq-mast">
    <div class="tq-mast-inner">
      <div class="tq-brand xc-isle" aria-live="polite">
        <span class="tq-brand-mark" aria-hidden="true"></span>
        <h1>天启</h1>
        <span class="xc-sw-w"><span class="xc-sub"></span></span>
        <span class="xc-isle-n" aria-hidden="true"></span>
      </div>
      <nav class="tq-nav" aria-label="工作台">
        <button class="xc-new-b tq-nav-key tq-nav-new" type="button" aria-label="新对话"><i class="tq-star-key" aria-hidden="true"></i><span>新对话</span></button>
        <button class="xc-list-b tq-nav-key" type="button" aria-label="对话记录" aria-expanded="false" aria-controls="tianqi-history"><i class="tq-planet-key" aria-hidden="true"></i><span>对话记录</span></button>
        <button class="tq-plug-b tq-nav-key" type="button" aria-label="插件" aria-expanded="false" aria-controls="tianqi-sheet" hidden><i class="tq-galaxy-key" aria-hidden="true"></i><span>插件</span></button>
        <button class="xc-x xc-ib" type="button" aria-label="关闭" title="关闭"></button>
      </nav>
    </div>
  </header>
  <div class="xc-st" role="status" aria-live="polite" hidden></div>
  <main class="tq-desk">
    <form class="xc-ft tq-console" aria-label="探索">
      <div class="tq-console-head"><h2>探索</h2><i class="tq-infinity" aria-hidden="true"></i></div>
      <div class="xc-menu" role="menu" hidden><button type="button" class="xc-mi xc-mi-file" role="menuitem">图片或文件</button></div>
      <div class="xc-pick" id="xin-model-picker" role="dialog" aria-label="模型和思考强度" hidden></div>
      <input type="file" class="xc-file" multiple hidden>
      <div class="xc-atts" hidden></div>
      <div class="xc-row tq-entry">
        <textarea rows="1" placeholder="给天启发消息" aria-label="消息"></textarea>
        <div class="tq-instruments">
          <button type="button" class="xc-mdl" aria-haspopup="dialog" aria-controls="xin-model-picker" aria-expanded="false"><span></span></button>
          <button type="button" class="xc-plus" aria-label="发图片或文件" aria-haspopup="menu" aria-expanded="false">附件</button>
          <button type="submit" class="xc-send" aria-label="发送"></button>
        </div>
      </div>
      <div class="xc-use" hidden></div>
    </form>
    <section class="tq-log" aria-labelledby="tianqi-conversation-title">
      <header class="tq-log-head">
        <span class="tq-log-icon" aria-hidden="true"></span>
        <h2 class="xc-conv-t" id="tianqi-conversation-title"></h2>
      </header>
      <div class="xc-body">
        <div class="xc-gw-warn" role="status" hidden>天启的网关还没配好，暂时发不了消息。</div>
        <div class="xc-up-w"><button type="button" class="xc-upchip" hidden></button></div>
        <div class="xc-msgs" aria-live="polite"></div>
        <div class="xc-jump-w"><button type="button" class="xc-jump" hidden><span>回到底部</span></button></div>
      </div>
    </section>
  </main>
  <div class="xc-sess" hidden></div>
  <div class="xc-scrim" aria-hidden="true"></div>
  <aside class="xc-drawer" id="tianqi-history" role="dialog" aria-label="对话记录" aria-hidden="true"><div class="xc-dr"></div></aside>
  <aside class="xc-work" hidden></aside>
  <form class="xc-login" hidden>
    <span class="xc-login-av" aria-hidden="true"></span>
    <b class="xc-login-t">登录天启</b>
    <input type="password" name="pw" autocomplete="current-password" placeholder="密码" aria-label="密码" required>
    <button type="submit" class="xc-btn">登录</button>
    <p class="xc-err" role="alert"></p>
  </form>
  <section class="xc-sheet" id="tianqi-sheet" aria-label="详情" hidden></section>
  <div class="xc-pal" role="dialog" aria-label="搜索和命令" hidden></div>
  <div class="xc-toast" role="status" aria-live="polite"></div>
</template>
<script>window.LIMING_CHAT = { role: 'tianqi' };</script>
<script src="/xin/term.js?v=motion-20261119"></script>
<script src="/xin/chat.js?v=tianqi-desk-20261119"></script>
</body>
</html>
