<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" id="themeColor">
<title>天启 · Liming 工具箱</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>
  (function () {
    var h = document.documentElement;
    try { if (window.self !== window.top) h.classList.add('embed'); } catch (e) { h.classList.add('embed'); }
    if (/(?:^|[?&])embed=1(?:&|$)/.test(location.search)) h.classList.add('embed');
    var mq = window.matchMedia && matchMedia('(prefers-color-scheme: dark)');
    function apply() {
      var t = 'light';
      try { t = localStorage.getItem('lm.theme') || 'light'; } catch (e) {}
      var d = t === 'dark' || (t === 'auto' && mq && mq.matches);
      h.dataset.theme = d ? 'dark' : 'light';
      h.dataset.pref = t;
      var m = document.getElementById('themeColor');
      if (m) m.setAttribute('content', d ? '#121110' : '#f6f5f2');
    }
    apply();
    if (mq && mq.addEventListener) mq.addEventListener('change', apply);
    window.addEventListener('storage', function (e) { if (e.key === 'lm.theme') apply(); });
    window.addEventListener('message', function (e) { if (e.origin === location.origin && e.data && e.data.type === 'theme') apply(); });
  })();
</script>
