<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liming 工具箱</title>
<meta name="description" content="Liming 的个人工具箱">
<meta name="theme-color" content="#faf9f5" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工具箱">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>
  (function(){try{var t=localStorage.getItem('lm.theme')||'light';var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);var h=document.documentElement;h.dataset.theme=d?'dark':'light';h.dataset.pref=t;var m=document.getElementById('themeColor');if(m)m.setAttribute('content',d?'#1f1e1d':'#faf9f5');}catch(e){}})();
</script>
<link rel="stylesheet" href="/shell.css?v=hb1">
<link rel="stylesheet" href="/pixel.css?v=px2">
<link rel="stylesheet" href="/mascot.css?v=xr12">
<link rel="stylesheet" href="/xin/chat.css?v=xc7">
</head>
<body>
<main id="home">
  <header class="hd">
    <h1><span class="spark" aria-hidden="true">✻</span>工具箱</h1>
    <div class="xin-track" id="xinTrack"></div>
    <div class="hd-btns">
    <button id="searchBtn" class="round" type="button" aria-label="搜索工具" aria-expanded="false" aria-controls="cmd">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
    </button>
    <button id="themeBtn" class="round" type="button" aria-label="切换主题">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 3v2M12 19v2M5.64 5.64l1.42 1.42M16.94 16.94l1.42 1.42M3 12h2M19 12h2M5.64 18.36l1.42-1.42M16.94 7.06l1.42-1.42"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.6A7.6 7.6 0 1 1 9.4 4.5a6.1 6.1 0 0 0 10.1 10.1Z"/></svg>
      <svg class="auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.6"/><path d="M12 4.4a7.6 7.6 0 0 1 0 15.2Z" class="fill"/></svg>
    </button>
    </div>
  </header>

  <label class="cmd" id="cmd">
    <span class="caret" aria-hidden="true">&gt;</span>
    <input id="q" type="search" placeholder="搜索工具" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-label="搜索工具">
    <kbd>/</kbd>
  </label>

  <div id="grid" class="grid"></div>
  <p id="empty" class="empty" hidden>没有找到</p>
</main>

<div id="stage"></div>
<div id="toast" role="status"></div>

<script src="/tools.js?v=px1"></script>
<script src="/tools/stm32/study-core.js?v=s3-1"></script>
<script src="/shell.js?v=hb1"></script>
<script src="/mascot.js?v=xr16"></script>
<script src="/xin/chat.js?v=xc13"></script>
</body>
</html>
