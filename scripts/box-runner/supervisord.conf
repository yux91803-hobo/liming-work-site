[unix_http_server]
file=/var/lib/liming-actions-supervisor/control.sock
chmod=0600
[supervisord]
user=root
umask=077
logfile=/var/lib/liming-actions-supervisor/supervisord.log
logfile_maxbytes=2MB
logfile_backups=2
pidfile=/var/lib/liming-actions-supervisor/supervisord.pid
childlogdir=/var/lib/liming-actions-supervisor
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///var/lib/liming-actions-supervisor/control.sock
[program:liming-actions]
command=/usr/bin/python3 /opt/liming-runner-tools/bin/service-relay.py
directory=/var/lib/liming-actions/runner
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=90
stopasgroup=true
killasgroup=true
stdout_logfile=/var/lib/liming-actions-supervisor/runner.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
